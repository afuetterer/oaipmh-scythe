# Ref: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Set permissions at the job level.
permissions: {}

concurrency:
  group: codeql-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Perform CodeQL Analysis
    runs-on: ubuntu-slim
    permissions:
      actions: read           # Needed to read workflow metadata and logs
      contents: read          # Needed to checkout the repository code for scanning
      security-events: write  # Needed to upload the scan results to the Security tab
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      # Ref: https://github.com/github/codeql-action
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: python
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
