name: Checks

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review # this is needed to trigger checks, when an auto-generated "draft" PR is set for "ready for review".

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1
  UV_LOCKED: true # do not update the lockfile during `uv sync` and `uv run` commands

# Set permissions at the job level.
permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docs:
    name: Build docs
    # disables this workflow from running in a repository that is not part of the indicated organization/user
    if: github.repository_owner == 'afuetterer'
    runs-on: ubuntu-slim
    steps:
    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: latest-known
        python-version: '3.14'
        enable-cache: true
        prune-cache: false
        cache-suffix: docs
    - run: just docs-build

  required-checks-pass:
    name: Checks are passing
    runs-on: ubuntu-slim
    if: always()
    needs:
    - test
    - docs
    steps:
    - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
