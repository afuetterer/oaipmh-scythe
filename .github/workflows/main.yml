name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# Set permissions at the job level.
permissions: {}

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
  release:
    name: Create release using python-semantic-release
    runs-on: ubuntu-26.04
    # disables this workflow from running in a repository that is not part of the indicated organization/user
    if: github.repository_owner == 'afuetterer'
    permissions:
      contents: write # Needed for psr to push to protected main branch
    needs:
    - test
    outputs:
      released: ${{ steps.psr.outputs.released || 'false' }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # get all commits and tags
        persist-credentials: false
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
    - name: Create semantic release
      id: psr
      uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
      with:
        # allow python-semantic-release to push to protected main branch
        github_token: ${{ steps.app-token.outputs.token }}
        changelog: false
        vcs_release: false
    - name: Create GitHub Release from changelog
      if: steps.psr.outputs.released == 'true'
      run: |
        tag="${TAG}"
        URL=$(grep "^## \\[$tag\\]" CHANGELOG.md | sed 's/.*(\(https:[^)]*\)).*/\1/')
        awk '/^## \['"$tag"'\]/{p=1; next} /^## /{p=0} p' CHANGELOG.md > /tmp/release_notes.md
        printf '**Full Changelog**: %s\n' "$URL" >> /tmp/release_notes.md
        gh release create "${tag}" --title "${tag}" --notes-file /tmp/release_notes.md --target main --verify-tag 2>/dev/null || true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        TAG: ${{ steps.psr.outputs.tag }}
