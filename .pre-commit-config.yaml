# pre-commit
# Ref: https://pre-commit.com/#usage
# ------------------------------------------------------------------------------

# do not touch the cassette files: these are auto-generated by vcr.py
exclude: \/cassettes\/

default_language_version:
  python: '3.14'

repos:
  # Ref: https://pre-commit.com/#meta-hooks
- repo: meta
  hooks:
  - id: check-hooks-apply

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-ast
  - id: debug-statements
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: name-tests-test
    args: [--pytest-test-first]

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # frozen: 0.38.0
  hooks:
  - id: check-dependabot
  - id: check-github-workflows

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 67cd950188cc8e2611e9ac21d1b032fdd446c601  # frozen: v2.28.0
  hooks:
  - id: pyproject-fmt

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: 00c9d9edd7a5d4cb8241c158888c015d71873889  # frozen: v0.2.60
  hooks:
  - id: rumdl-fmt

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
  hooks:
  - id: ruff-check
    args: [--fix, --show-fixes, --exit-non-zero-on-fix]
  - id: ruff-format

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: 1241d80d7f628b8b0c60540b7a8c83b947136a4f  # frozen: v0.0.74
  hooks:
  - id: ty
    args: [--group=types]

- repo: https://github.com/scientific-python/cookie
  rev: 1589a99867d6cac494ac7545fe6a83108580a3ee  # frozen: 2026.08.14
  hooks:
  - id: sp-repo-review

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
  hooks:
  - id: zizmor
    args:
    - --fix
    - --no-progress
    - --pedantic

- repo: https://github.com/crate-ci/typos
  rev: 8a48f81b6c64dcfea44b3633223084c4be58ac5f  # frozen: v1.49.0
  hooks:
  - id: typos
    args: [--force-exclude]
    exclude: CHANGELOG.md # the commit hashes in changelog trigger the spell checker

- repo: https://github.com/FHPythonUtils/LicenseCheck/
  rev: 21abbebb654a297a8e7b62ddebe7a77504171386  # frozen: 2026.0.8
  hooks:
  - id: licensecheck

- repo: https://github.com/compilerla/conventional-pre-commit
  rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0-pre1
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
