# pre-commit
# Ref: https://pre-commit.com/#usage
# ------------------------------------------------------------------------------

# do not touch the cassette files: these are auto-generated by vcr.py
exclude: \/cassettes\/

default_language_version:
  python: '3.14'

repos:
  # Ref: https://pre-commit.com/#meta-hooks
- repo: meta
  hooks:
  - id: check-hooks-apply

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-ast
  - id: debug-statements
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: name-tests-test
    args: [--pytest-test-first]

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
  hooks:
  - id: check-dependabot
  - id: check-github-workflows

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 59e7b26529dc6f15c43063064b8b06ded60d0910  # frozen: v2.29.4
  hooks:
  - id: pyproject-fmt

- repo: https://github.com/rvben/rumdl-pre-commit
  rev: cbd02203fbbb2839cd7e25e3062628ba4af18991  # frozen: v0.2.77
  hooks:
  - id: rumdl-fmt

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix, --show-fixes, --exit-non-zero-on-fix]
  - id: ruff-format

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: 6972e4c5a7e9f45f05a2f30b668f221f43b770c9  # frozen: v0.0.84
  hooks:
  - id: ty
    args: [--group=types]

- repo: https://github.com/scientific-python/cookie
  rev: 1589a99867d6cac494ac7545fe6a83108580a3ee  # frozen: 2026.08.14
  hooks:
  - id: sp-repo-review

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor
    args:
    - --fix
    - --no-progress
    - --pedantic

- repo: https://github.com/crate-ci/typos
  rev: 512fc24f32f44ab01972217aaaf3dc86ec234d53  # frozen: v1.50.2
  hooks:
  - id: typos
    args: [--force-exclude]
    exclude: CHANGELOG.md # the commit hashes in changelog trigger the spell checker

- repo: https://github.com/FHPythonUtils/LicenseCheck/
  rev: 21abbebb654a297a8e7b62ddebe7a77504171386  # frozen: 2026.0.8
  hooks:
  - id: licensecheck

- repo: https://github.com/compilerla/conventional-pre-commit
  rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0-pre1
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
