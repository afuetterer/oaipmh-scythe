                  <dc:creator>Brunner, Jacob</dc:creator>
                  <dc:date>2026-06-03</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This is a collection of STL files for an adaptive phantom. The phantom has been 3D-printed at the Medical University of Vienna for the purpose of establishing a testing framework for adaptive particle therapy. The phantoms size and possible modifications were chosen to mimic human anatomical changes in the head and neck region and to&amp;nbsp;guarantee transportability and stability at the same time.&amp;lt;br&amp;gt;The modifications feature an outer shell, which can simulate weight change, and lateral inserts, which can simulate intracavitary changes.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;The dataset includes a &amp;lt;em&amp;gt;readme&amp;lt;/em&amp;gt; with brief descriptions for each STL part.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Material considerations for the original phantom and its use in particle therapy are published in: https://doi.org/10.3389/fphy.2024.1323788&amp;lt;/p&amp;gt;</dc:description>
