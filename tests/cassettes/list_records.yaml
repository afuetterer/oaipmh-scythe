              <header>
                <identifier>oai:zenodo.org:19363068</identifier>
                <datestamp>2026-04-01T02:22:19Z</datestamp>
                <setSpec>software</setSpec>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Shawn C. Wright</dc:creator>
                  <dc:date>2026-04-01</dc:date>
                  <dc:description>&amp;lt;h2&amp;gt;CRI-CORE v0.11.0&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;This release stabilizes the CRI-CORE enforcement kernel and introduces a usable public API surface for deterministic admissibility evaluation.&amp;lt;/p&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Highlights&amp;lt;/h2&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Public &amp;lt;code&amp;gt;evaluate()&amp;lt;/code&amp;gt; API for programmatic enforcement&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Full alignment with sealed run artifact model&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Deterministic enforcement pipeline with strict invariants&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Runtime packaging improvements for installed environments&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Added&amp;lt;/h2&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Public evaluation entrypoint:&amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;from cricore import evaluate&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Structured &amp;lt;code&amp;gt;EvaluationResult&amp;lt;/code&amp;gt; output:&amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;commit_allowed&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;failed_stages&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;summary&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Self-contained runtime schema loading (&amp;lt;code&amp;gt;cricore.schema&amp;lt;/code&amp;gt;)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Test pattern for generating sealed runs prior to evaluation&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Changed&amp;lt;/h2&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Enforcement model now assumes immutable, finalized run artifacts&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Tests updated to generate fresh runs instead of reusing existing directories&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Evaluation now operates against sealed artifacts only (no mutation during evaluation)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;README updated to reflect execution boundary model and run lifecycle&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Fixed&amp;lt;/h2&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Resolved import issues with public API exposure&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Eliminated repository-relative schema dependencies&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Fixed packaging inconsistencies affecting installed environments&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Corrected integrity and seal mismatch behavior caused by mutable runs&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Enforcement Model&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;CRI-CORE enforces admissibility at the execution boundary through a deterministic pipeline:&amp;lt;/p&amp;gt;
        &amp;lt;ol&amp;gt;
        &amp;lt;li&amp;gt;run-structure&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;structure-contract-version-gate&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;structure-contract-hash-gate&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;independence&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;integrity&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;integrity-finalization&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;publication&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;publication-commit&amp;lt;/li&amp;gt;
        &amp;lt;/ol&amp;gt;
        &amp;lt;p&amp;gt;Final decision:&amp;lt;/p&amp;gt;
        &amp;lt;pre&amp;gt;&amp;lt;code&amp;gt;commit_allowed = True | False
        &amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Run Lifecycle&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;CRI-CORE operates on sealed run artifacts:&amp;lt;/p&amp;gt;
        &amp;lt;pre&amp;gt;&amp;lt;code&amp;gt;generate → finalize → evaluate → (optional) commit
        &amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;
        &amp;lt;p&amp;gt;Once finalized, a run is immutable.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Any modification invalidates the seal and will result in enforcement failure.&amp;lt;/p&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Notes&amp;lt;/h2&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;CRI-CORE does not interpret governance semantics or external state&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;All inputs are treated as declarative and deterministic&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;The kernel evaluates structure, integrity, and binding only&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h2&amp;gt;Concept DOI&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;https://doi.org/10.5281/zenodo.19080238&amp;lt;/p&amp;gt;</dc:description>
