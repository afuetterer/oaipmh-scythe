                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:subject>Diabetic retinopathy; Salvia miltiorrhiza; Network pharmacology; Molecular docking; Gene enrichment analysis; Luteolin; Tanshinones IIA</dc:subject>
                  <dc:title>Supplementary data of the article "Identification and Validation of Molecular Mechanisms of Salvia Miltiorrhiza in Treating Diabetic Retinopathy: A Network Pharmacology and Molecular Docking Study."</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
              </metadata>
