            <record>
              <header>
                <identifier>oai:zenodo.org:18876293</identifier>
                <datestamp>2026-04-01T10:32:21Z</datestamp>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Sizaret, Anne</dc:creator>
                  <dc:date>2026-03-05</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Deux grandes modalit&amp;eacute;s compl&amp;eacute;mentaires existent pour faciliter l&amp;rsquo;acc&amp;egrave;s de tous les publics &amp;agrave; la vaccination :&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Le &amp;laquo; ramener vers &amp;raquo;, c&amp;rsquo;est-&amp;agrave;-dire l&amp;rsquo;incitation et la facilitation de la prise de rendez- vous ou de la venue en centre de vaccination (ex : communication cibl&amp;eacute;e, organisation du transport, appui &amp;agrave; la prise de rendez-vous sur des cr&amp;eacute;neaux d&amp;eacute;di&amp;eacute;s, accompagnement physique&amp;hellip;) ;&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;laquo; L&amp;rsquo;aller vers &amp;raquo;, c&amp;rsquo;est-&amp;agrave;-dire le d&amp;eacute;ploiement d&amp;rsquo;&amp;eacute;quipes mobiles, au plus pr&amp;egrave;s des lieux de vie et de sociabilit&amp;eacute; des publics, l&amp;rsquo;organisation d&amp;rsquo;&amp;eacute;v&amp;egrave;nements, vers des structures d&amp;rsquo;accueil, des associations communautaires, points sant&amp;eacute;...&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;p&amp;gt;Ce dossier documentaire sur l'aller vers la vaccination&amp;nbsp;conjugue ces deux modalit&amp;eacute;s d&amp;rsquo;acc&amp;egrave;s &amp;agrave; la sant&amp;eacute;. Il a pour objectif de&amp;nbsp;:&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Clarifier le concept d&amp;rsquo;Aller-vers&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Dresser un &amp;eacute;tat de connaissances sur les attitudes des publics quant &amp;agrave; la vaccination&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Rep&amp;eacute;rer des r&amp;eacute;f&amp;eacute;rentiels de bonnes pratiques ou des recommandations.&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;p&amp;gt;Le dossier est structur&amp;eacute; en 6 parties&amp;nbsp;:&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;"De quoi parlons-nous ?"&amp;lt;/strong&amp;gt;, un glossaire proposant des d&amp;eacute;finitions sourc&amp;eacute;es de concepts importants li&amp;eacute;s &amp;agrave; la th&amp;eacute;matique de sant&amp;eacute; du dossier, &amp;agrave; la m&amp;eacute;thodologie de projet, et aux leviers d&amp;rsquo;intervention en promotion de la sant&amp;eacute;. L&amp;rsquo;enjeu ici est de parler le m&amp;ecirc;me langage et de construire une culture en sant&amp;eacute; publique et promotion de la sant&amp;eacute; partag&amp;eacute;e.&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Des &amp;eacute;l&amp;eacute;ments contextuels&amp;nbsp;: &amp;lt;strong&amp;gt;&amp;laquo; Politique de sant&amp;eacute; et action publique"&amp;lt;/strong&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;La partie sur "&amp;lt;strong&amp;gt;la mise en place des d&amp;eacute;marches &amp;lt;em&amp;gt;Aller vers&amp;lt;/em&amp;gt;"&amp;lt;/strong&amp;gt; propose des &amp;eacute;l&amp;eacute;ments m&amp;eacute;thodologiques et strat&amp;eacute;giques. Des exemples d&amp;rsquo;actions, et notamment de vaccination sont &amp;eacute;galement r&amp;eacute;f&amp;eacute;renc&amp;eacute;es.&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Le chapitre &amp;lt;strong&amp;gt;"&amp;lt;/strong&amp;gt;&amp;lt;strong&amp;gt;Attitudes, pratiques et opinion &amp;agrave; l'&amp;eacute;gard de la vaccination"&amp;lt;/strong&amp;gt; aborde l&amp;rsquo;intention et l&amp;rsquo;h&amp;eacute;sitation vaccinale en g&amp;eacute;n&amp;eacute;ral, et s&amp;rsquo;int&amp;eacute;resse d&amp;rsquo;un peu plus pr&amp;egrave;s &amp;agrave; des publics plus sp&amp;eacute;cifiques&amp;nbsp;: les personnes en situation de pr&amp;eacute;carit&amp;eacute;, les s&amp;eacute;niors, les parents ou les professionnels de sant&amp;eacute;.&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;La "&amp;lt;strong&amp;gt;Vaccination HPV"&amp;lt;/strong&amp;gt; a retenu ensuite notre attention, dans un chapitre d&amp;eacute;di&amp;eacute;. Comment communiquer autour de cette vaccination, quelles sont les strat&amp;eacute;gies, quelles sont les attitudes des parents, des jeunes et des professionnels de sant&amp;eacute; &amp;agrave; son &amp;eacute;gard.&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;L'entretien motivationnel et la litt&amp;eacute;ratie sont deux mod&amp;egrave;les d&amp;rsquo;intervention qui ont fait leur preuve pour promouvoir la vaccination. Ce chapitre est consacr&amp;eacute; aux &amp;lt;strong&amp;gt;"Strat&amp;eacute;gies de vaccination"&amp;lt;/strong&amp;gt;, et propose en particulier des r&amp;eacute;f&amp;eacute;rences bibliographiques de mod&amp;egrave;les utilis&amp;eacute;s&amp;nbsp;par l&amp;rsquo;Organisation mondiale de la sant&amp;eacute;.&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Enfin, la derni&amp;egrave;re partie du dossier documentaire pr&amp;eacute;sente des r&amp;eacute;f&amp;eacute;rences d&amp;rsquo;&amp;lt;strong&amp;gt;"Outils d'intervention et de ressources p&amp;eacute;dagogiques"&amp;lt;/strong&amp;gt; compl&amp;eacute;mentaires.&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;</dc:description>
