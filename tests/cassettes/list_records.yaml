                  <dc:source>Journal of Applied Health Sciences and Medicine, 5(9), 9-15, (2025-09-19)</dc:source>
                  <dc:subject>Lidocaine, Immunohistochemistry, Neurotoxicity, and Trigeminal nerve system.</dc:subject>
                  <dc:title>Lidocaine induce neurotoxicity and peripheral nerve injury in trigeminal nerve system</dc:title>
