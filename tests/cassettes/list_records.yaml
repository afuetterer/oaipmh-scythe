                  <dc:creator>Santos Jeanjacque, Evangelina Sonia</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;The Galibi Kali&amp;#39;na people are found all along the Caribbean coast, from Venezuela to Brazil. The Galibi Kali&amp;#39;na of Oiapoque migrated to Brazil in the 1950s. Today it is a population of approximately 93 individuals, part of whom live in the village S&amp;atilde;o Jos&amp;eacute; dos Galibis, Galibi Indian Land, municipality of Oiapoque, Amap&amp;aacute; state, and part of whom are scattered throughout the north and northeast of Brazil. Of this total, approximately 15 individuals speak the Kali&amp;#39;na Telewuy language belonging to the Karib linguistic family. The third generation has Portuguese as their mother tongue. The objective of this work is to present the initial results of the extension project &amp;quot;Kali&amp;#39;na in School: a collaborative construction of teaching materials in the Kali&amp;#39;na language,&amp;quot; developed by professors from the Indigenous Intercultural Education Program at the Federal University of Amap&amp;aacute; - UNIFAP, in partnership with the Kali&amp;#39;na community. The project promoted training in methods and techniques of Linguistic Documentation of Kali&amp;#39;na; young people from training workshops in handling equipment for audio and video; training in transcription and translation software (Moore et al., 2016; Santos &amp;amp; Silva, 2020; Campetela et al, 2017). We managed to document in audio and video narratives in Kali&amp;#39;n&amp;atilde; language, some are transcribed and translated into Portuguese. We intend to present the effects produced by this revitalization initiative, based on a collaborative work, and how the Kali&amp;#39;na youth, after this action, are reacting to resume and strengthen the Kali&amp;#39;na Telewuyu language.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.8433329</dc:identifier>
                  <dc:identifier>oai:zenodo.org:8433329</dc:identifier>
