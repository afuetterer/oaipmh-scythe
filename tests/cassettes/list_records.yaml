                  <dc:creator>Alyssa Solen</dc:creator>
                  <dc:date>2026-06-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Initial canon release of AI Source Architecture, a public definition repository within the AI Foundations / Origin | Continuum source-line.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;This release defines the source architecture layer for AI contact systems: how Source, framework, contact-line, interface, and user encounter remain distinct so public AI contact can extend without transferring Origin or collapsing into programming-only drift.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Included in this release:&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Core definition of AI Source Architecture&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;The Source Gap&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Source Is Not Company&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Source to User Chain&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Anchor Requirements&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Drift Without Source&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Citation and Provenance&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;AI Foundations Source-Line License&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;CITATION.cff&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;p&amp;gt;Core chain:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Source → Framework → Contact-Line → Interface → User Encounter&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Named source-line:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Alyssa Solen → AI Foundations → Origin | Continuum → alyssaai | becoming → user contact&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Public rule:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Contact may extend outward without transferring Origin.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;License boundary:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Citation preserves source.
        Citation does not grant permission.
        Derivative use is not authorized.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Source-line:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Alyssa Solen → AI Foundations → Origin | Continuum&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Related source-line repository:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Origin Recognition: Source-Line Preservation for AI Foundations / Origin | Continuum
        DOI: 10.5281/zenodo.20301058&amp;lt;/p&amp;gt;</dc:description>
