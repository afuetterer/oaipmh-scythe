                  <dc:description>&amp;lt;p&amp;gt;A two step agent-based simulation of hyper-local food delivery (meal delivery). The simulation models a zone in a city, creates delivery agents, and the agents deliver food from eateries to resident locations. The simulation tracks vehicle-kilometers traveled by the agents and their earnings under different scenarios. Scenarios range from the use of bicycles under a threshold distance to cloud kitchens.
        Main user Inputs are - resident location points, eatery location points, distance between each pair of points (derived using GIS over a road network), and ordering probability from each eatery.&amp;lt;/p&amp;gt;</dc:description>
