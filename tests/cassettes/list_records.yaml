                  <dc:source>Journal of Applied Health Sciences and Medicine, 5(11), 16-25, (2025-11-27)</dc:source>
                  <dc:subject>Malaria, Antimalarials, Plasmodium falciparum, Antimalarial Resistance, and Drug-resistant malaria</dc:subject>
                  <dc:title>Malaria, Antimalarials And the Rising Spate of Antimalarial Resistance in Nigeria: A Global Threat</dc:title>
