                  <dc:description>&amp;lt;p&amp;gt;UUON Fractal API — Mathematical Fractal Analysis and Parameter Advisory v1.0.0&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Public mathematical API layer for the UUON Fractal Engine (proprietary WebGL2/GLSL renderer).
        Exposes fractal dimension measurement, parameter recommendations, and formula knowledge base.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Three modules:&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Module A: Fractal Analyzer (box-counting, wavelet, lacunarity, ensemble)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Module B: Parameter Advisor (plain language to engine parameter set)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Module C: Knowledge Base (generators, algorithms, coloring modes)&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;p&amp;gt;Docker and Python deployments supported. 20+ tests included.
        Companion to uuon-clouud-api.&amp;lt;/p&amp;gt;
