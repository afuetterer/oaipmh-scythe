                  <rightsList>
                    <rights rightsURI="https://creativecommons.org/licenses/by/4.0/legalcode" rightsIdentifierScheme="spdx" rightsIdentifier="cc-by-4.0">Creative Commons Attribution 4.0 International</rights>
                    <rights rightsURI="info:eu-repo/semantics/openAccess"/>
                  </rightsList>
                  <descriptions>
                    <description descriptionType="Abstract">Here we share the local projection matrix for generating BLPCs for genetic risk prediction.
        
        
        We use imputed genetic variants (v3) from the UK Biobank, after overlapping with the HapMap3 reference panel.
        
        
        We generate BLPCs for the 1701 European independent genomics regions defined in Berisa and Pickrell (2016, PMC4731402).
        
        
        In each region, we keep the top-rank PCs that can explain 65% variance among genetic variants.
        
        
        More details can be found at https://arxiv.org/abs/2203.12003</description>
                    <description descriptionType="Other">This is supplementary data for "On block-wise and reference panel-based estimators for genetic data prediction in high dimensions" (arXiv:2203.12003).</description>
                  </descriptions>
                </resource>
              </metadata>
            </record>
