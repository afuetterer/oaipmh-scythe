                  <dc:description>&amp;lt;i&amp;gt;Oxygonia&amp;lt;/i&amp;gt; Mannerheim, 1837   &amp;lt;p&amp;gt; After the previous papers on the genus (Horn (1905), Kippengan (1997)), 20 recognized (and one uncertain) &amp;lt;i&amp;gt;Oxygonia&amp;lt;/i&amp;gt; species were presented recently by Moravec (2020), occurring mostly along the Andean mountain streams and distributed from Costa Rica and Panama to Colombia, then southwards to Ecuador, Peru and northern Bolivia. Interestingly enough, &amp;lt;i&amp;gt;Oxygonia nigricans&amp;lt;/i&amp;gt; W. Horn, 1826 was originally described from a maritiam habitat of the small Georgona Island off the Colombian Pacific coast, yet in Panama was later caught on Rio Cana at altitude 500 m. Fourteen recognized taxa occur in Ecuador, six of which are Ecuadorian endemics.&amp;lt;/p&amp;gt;   &amp;lt;p&amp;gt;Some species of this genus can be recorded during the day, some at night, and some both, during day and night. Individuals are mainly found on partially flooded, rather larger boulders and stones, usually in the middle of fastflowing streams with a width of 1 to 15 m, where they search for prey of smaller aquatic insects. Most species, when disturbed and according to the natural character of the water course, fly to another boulder in the stream or a rock on the bank or to the leaves of coastal vegetation reaching above the water surface, where they also rest during periods of inactivity.&amp;lt;/p&amp;gt;  &amp;lt;p&amp;gt; &amp;lt;i&amp;gt;Oxygonia oberthueri&amp;lt;/i&amp;gt; (Fig. 13) was the only species of this genus recorded on studied localities. Pearson &amp;lt;i&amp;gt;et al.&amp;lt;/i&amp;gt; (1995) published the results of natural history observations on nine Ecuadorian species of &amp;lt;i&amp;gt;Oxygonia&amp;lt;/i&amp;gt;. They mentioned diurnal activity of &amp;lt;i&amp;gt;Oxygonia oberthueri&amp;lt;/i&amp;gt;, that forages on rocks and moss-covered vegetation near the water&amp;rsquo;s surface. It regularly flies to overhanging foliage to escape danger. It is found along small (&amp;lt;1 m wide) streams to moderate rivers (&amp;gt; 15 m wide) from 300‒1300 m elevation.&amp;lt;/p&amp;gt;   &amp;lt;p&amp;gt;Our observations confirm both diurnal and nocturnal activities. The nocturnal activity seems to be preferred by this species according night vision observation however the same behaviour was observed during the day and night. The individuals move quickly on boulder surfaces and often fly from one to another. The mating pair was observed during the night when the female foraged undisturbed during mating. The male held the female with his mandibles on the upper part of her elytra, not in metepisternum as presupposed.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:description>Published as part of &amp;lt;i&amp;gt;Šafránek, Ondřej, Serrano, Verónica Lucía Caballero &amp;amp; Carrasco, Juan Carlos, 2023, Rediscovery and redescription of Oxycheila buestani Wiesner with the first female record and new methodology for observation of Oxycheila Dejean and Oxygonia Mannerheim (Coleoptera: Cicindelidae), pp. 131-142 in Zootaxa 5353 (2)&amp;lt;/i&amp;gt; on page 139, DOI: 10.11646/zootaxa.5353.2.3, &amp;lt;a href="http://zenodo.org/record/8427129"&amp;gt;http://zenodo.org/record/8427129&amp;lt;/a&amp;gt;</dc:description>
