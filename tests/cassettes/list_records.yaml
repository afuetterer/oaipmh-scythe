              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Bharat Singh Rawat</dc:creator>
                  <dc:date>2026-04-01</dc:date>
                  <dc:description>&amp;lt;h3&amp;gt;&amp;lt;strong&amp;gt;Welcome to the newest release of PY-BEMCSv2.1.0!&amp;lt;/strong&amp;gt;&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;This update brings a massive leap in performance, graphical interactivity, and advanced physical modeling.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Performance &amp;amp; Core Engine Upgrades&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;ol&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Taichi GPU-Accelerated Backend: The core physics engine has been overhauled to utilize the Taichi programming language. Computationally heavy tasks, including 2D Finite Difference Thermal Conduction, Particle Density Accumulation, and Bilinear Particle Pushing, are now deeply parallelized and run natively on the GPU (or multi-core CPU).&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Precision Control: Easily switch between maximum speed (32-bit floats on consumer GPUs) and high precision (64-bit floats via CPU fallback) depending on your simulation needs.&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Sparse Matrix Laplacian Solver: Integrates scipy.sparse with SuperLU factorization for blisteringly fast and stable solutions to Poisson's equation during electrostatic recalculations.&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;/ol&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Advanced Physics &amp;amp; Morphing Capabilities&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;ol&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Dynamic Multi-Grid Optics: Say goodbye to fixed 2-grid limitations. You can now dynamically add, configure, and remove an arbitrary number of grids directly from the GUI (Screen, Accelerator, Decelerator, etc.).&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Thermo-Mechanical Morphing: Simulates real-time grid heating and thermal expansion. The engine dynamically calculates thermal gap reduction (e.g., Molybdenum expansion) and triggers domain remeshing on the fly.&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;p&amp;gt;RF Co-Extraction: Easily superimpose Radio Frequency (RF) modulated potentials onto any specific DC grid to study co-extraction of ions and electrons.&amp;lt;/p&amp;gt;
        &amp;lt;/li&amp;gt;
        &amp;lt;/ol&amp;gt;</dc:description>
