                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Teneche Sánchez, María Fernanda</dc:creator>
                  <dc:date>2026-06-10</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Este art&amp;iacute;culo examina las configuraciones de la identidad femenina en novelas contempor&amp;aacute;neas&amp;lt;br&amp;gt;escritas por autoras colombianas. El objetivo es analizar c&amp;oacute;mo ciertas&amp;lt;br&amp;gt;protagonistas negocian su subjetividad en relaci&amp;oacute;n con mandatos e idealizaciones&amp;lt;br&amp;gt;de g&amp;eacute;nero. El estudio se apoya en una perspectiva psicoanal&amp;iacute;tica, particularmente en&amp;lt;br&amp;gt;teor&amp;iacute;as sobre la constituci&amp;oacute;n del sujeto, el deseo y el conflicto con la ley simb&amp;oacute;lica,&amp;lt;br&amp;gt;articuladas con los estudios de g&amp;eacute;nero y los an&amp;aacute;lisis literarios. Se argumenta que,&amp;lt;br&amp;gt;mientras algunas protagonistas reproducen discursos normativos internalizados,&amp;lt;br&amp;gt;otras recurren al (auto)exilio como estrategia de ruptura con la tradici&amp;oacute;n, lo que les&amp;lt;br&amp;gt;permite reconfigurar su lugar en el orden social. El art&amp;iacute;culo aporta a la comprensi&amp;oacute;n&amp;lt;br&amp;gt;de los procesos de subjetivaci&amp;oacute;n femenina en contextos patriarcales y a la articulaci&amp;oacute;n&amp;lt;br&amp;gt;interdisciplinar entre el psicoan&amp;aacute;lisis y los estudios literarios, destacando c&amp;oacute;mo la&amp;lt;br&amp;gt;literatura puede revelar formas complejas de resistencia, agencia y resignificaci&amp;oacute;n del&amp;lt;br&amp;gt;lugar de las mujeres en el entramado cultural.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.17533/udea.elc.358807</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20633463</dc:identifier>
                  <dc:language>spa</dc:language>
                  <dc:language>eng</dc:language>
                  <dc:publisher>Zenodo</dc:publisher>
