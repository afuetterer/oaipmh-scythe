                <identifier>oai:zenodo.org:19373743</identifier>
                <datestamp>2026-04-01T19:30:10Z</datestamp>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Ukarande, Sai</dc:creator>
                  <dc:date>2026-04-01</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This research paper presents &amp;lt;strong&amp;gt;VisionRoom&amp;lt;/strong&amp;gt;, a web-based Augmented Reality (AR) interior visualization system designed to improve the online furniture shopping experience. Traditional e-commerce platforms rely on static images and dimensions, making it difficult for users to visualize how furniture will fit and look in their actual living spaces.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;To address this problem, VisionRoom enables users to &amp;lt;strong&amp;gt;place real-scale 3D furniture models directly into their environment&amp;lt;/strong&amp;gt; using a smartphone camera. The system leverages &amp;lt;strong&amp;gt;WebXR for plane detection&amp;lt;/strong&amp;gt; and &amp;lt;strong&amp;gt;Three.js for rendering&amp;lt;/strong&amp;gt;, allowing virtual furniture to be accurately positioned on detected surfaces like floors and walls. Users can interact with these models in real time by moving, rotating, and adjusting them to explore different layout configurations.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;The system architecture consists of modules for room scanning, 3D model management, AR rendering, and user interaction. It uses optimized 3D models and real-time rendering techniques to ensure smooth performance across devices. The placement of objects is mathematically handled using transformation matrices to maintain accurate scale and positioning in the real world.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Experimental evaluation shows that AR-based visualization significantly improves user experience. In a simulated user study, participants using VisionRoom completed tasks faster and reported higher confidence compared to traditional methods. Performance results indicate high surface detection accuracy, smooth rendering, and responsive interaction across different device types.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Overall, VisionRoom demonstrates how AR technology can enhance &amp;lt;strong&amp;gt;spatial understanding, decision-making, and customer satisfaction&amp;lt;/strong&amp;gt; in interior design and furniture purchasing. Future improvements include AI-based recommendations, multi-user collaboration, and integration with e-commerce platforms.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19373743</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19373743</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.5281/zenodo.19373742</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:title>Luxury: Augmented Reality Based Interior Visualization System for Real-Scale Furniture Placement</dc:title>
                  <dc:type>info:eu-repo/semantics/other</dc:type>
                </oai_dc:dc>
              </metadata>
            </record>
            <record>
              <header>
                <identifier>oai:zenodo.org:19368305</identifier>
                <datestamp>2026-04-01T11:24:25Z</datestamp>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>AIRCC</dc:creator>
                  <dc:date>2026-01-30</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;These Irregular Sudoku puzzles are an interesting variant for its analysis using a prominent knowledge representation language with roots in logic programming. This language is well-known as Clingo is based on answer set programming, it is based on the stable model semantics of logic programming. We propose an ASP-based method for generating and solving irregular NxN Sudoku using Clingo, focusing on how non-standard regions impact constraint design and solver efficiency. The model supports arbitrary polyomino-style zones, validating region structure and enforcing Sudoku rules without relying on fixed sub grids. By optimizing grounding, reducing redundant constraints, and applying region-aware heuristics, the system mitigates the combinatorial cost introduced by irregular layouts. In addition, an integrated system is built using Python and Godot as Front-End and Clingo as Back-End. Experimental evaluation across 2400 instances of 4x4 and 9x9 puzzles demonstrates that our approach maintains high solving efficiency, with irregular puzzles showing only a 4.9%.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5121/ijaia.2026.17104</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19368305</dc:identifier>
                  <dc:identifier>https://doi.org/10.5121/ijaia.2026.17104</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.5121/ijaia.2026.17104</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>International Journal of Artificial Intelligence &amp; Applications (IJAIA), 17(1), 69 - 79, (2026-01-30)</dc:source>
                  <dc:title>Answer Set Programming in Solving Irregular Sudoku Puzzles</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
              </metadata>
