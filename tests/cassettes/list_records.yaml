                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Norbibish Sharopovna Rakhimova</dc:creator>
                  <dc:date>2026-04-01</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;The article considers the problem of the formation of professional and communicative competence among students of national groups of technical universities in the process of learning the Russian language. The relevance of the research is due to the contradiction between the high requirements for the language of the specialty and the insufficient development of methods for introducing non-standard vocabulary (professionalisms, jargonisms and slang) into the educational process. The purpose of the work is to theoretically substantiate and present a practical methodology for using professionalism as a means of intensifying the teaching of the Russian language to future engineers. The author highlights the linguodidactic principles of lexical material selection, describes the stages of working with professionalism, and suggests types of exercises that help students to be prepared for real professional communication in Russian. Special attention is paid to the comparative analysis of the Russian approach to professionally oriented education and the European ESP (English for Specific Purposes) model, as well as issues of interdepartmental interaction as a condition for the effective implementation of the proposed methodology.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19374447</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19374447</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
