                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:title>Plastid and Nuclear (ITS) Sequence Dataset - Study of Natural Hybridization between Verbascum virgatum and V. sinuatum</dc:title>
