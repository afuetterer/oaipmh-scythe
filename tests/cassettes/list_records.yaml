              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Marques, Isabel</dc:creator>
                  <dc:creator>Schwarzer, Udo</dc:creator>
                  <dc:date>2025-12-02</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This dataset contains the original plastid DNA sequences and cloned nuclear ITS sequences used to investigate natural hybridization between&amp;nbsp;&amp;lt;em&amp;gt;Verbascum virgatum&amp;lt;/em&amp;gt; and &amp;lt;em&amp;gt;Verbascum sinuatum&amp;lt;/em&amp;gt; in southwestern Portugal.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Dataset Contents&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Plastid DNA sequences (FASTA format)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Cloned ITS sequences (FASTA format)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Sequence alignments&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Metadata table including ID of samples&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;span&amp;gt;&amp;lt;strong&amp;gt;Methods Overview&amp;lt;/strong&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;DNA was extracted from leaf tissue and plastid and nuclear ribosomal ITS regions were amplified using standard protocols. ITS amplicons were cloned to resolve intra-individual polymorphism. Sequences were aligned and analyzed to infer maternal lineage and nuclear contributions from parental taxa.&amp;lt;/p&amp;gt;</dc:description>
