                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:contributor>Hasselbring, Wilhelm</dc:contributor>
                  <dc:contributor>Krause-Glau, Alexander</dc:contributor>
                  <dc:creator>Brück, Johannes</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Supplementary package for thesis: Performance Analysis and Re-Engineering of ExplorViz&amp;rsquo;s Collaboration Mode&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;A detailed description can be found in the &amp;lt;em&amp;gt;README.md&amp;lt;/em&amp;gt;.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Abstract&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Modern software systems are becoming increasingly complex, necessitating advanced tools for comprehension and effective communication among developers. ExplorViz, a Software Visualization as a Service (SVaaS) tool, aids developers in understanding complex software systems. ExplorViz&amp;#39;s Collaboration Mode enables interactive exploration of software landscapes in multi-user sessions across various platforms, such as VR or AR. However, the Collaboration Mode has not been tested under high user load, and the underlying architecture is not inherently scalable.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;This thesis aims to comprehensively analyze the performance of ExplorViz&amp;#39;s Collaboration Mode and, based on the results, re-engineer it to better support multi-user sessions with high interaction. To achieve this, we define a benchmark to competitively evaluate our re-engineering effort.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;The benchmarking analysis revealed the underlying Collaboration Service and high message traffic as primary performance bottlenecks. We have undertaken a re-engineering effort, resulting in a system that enables horizontal scaling, reliable WebSocket connections, and efficient platform-specific messaging to minimize network traffic. Evaluation of the re-engineered system demonstrated high responsiveness and effective resource utilization. Horizontal scaling allows for a successive increase in capacity. However, scalability is somewhat impeded due to the high overhead for server coordination.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;&amp;nbsp;&amp;lt;/p&amp;gt;</dc:description>
