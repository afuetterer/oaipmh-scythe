                    <description descriptionType="Abstract">This code uses the gFlex code (Wickert, 2016) which solves the flexure equations in 3D, here from an analytical solution. The elastic thickness is therefore constant. Was implemented:
        
        
        
        	
            Reading a grid representing a spatially variable load
        	
            Viscous lithospheric relaxation (see Turcotte and Schubert)
        	
            Calculations of strain and stress tensors at any point</description>
