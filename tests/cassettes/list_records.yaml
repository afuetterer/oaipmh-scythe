                  <dc:description>&amp;lt;p&amp;gt;Penelitian ini bertujuan untuk menguji terpenuhinya asumsi klasik regresi, khususnya normalitas residual dan homoskedastisitas, pada model regresi yang menjelaskan laba PT Sumber Alfaria Trijaya Tbk. Variabel dependen yang digunakan adalah &amp;lt;em&amp;gt;Jumlah Laba&amp;lt;/em&amp;gt;, sedangkan variabel independen meliputi &amp;lt;em&amp;gt;Jumlah Aset&amp;lt;/em&amp;gt;, &amp;lt;em&amp;gt;Jumlah Liabilitas&amp;lt;/em&amp;gt;, dan &amp;lt;em&amp;gt;Penjualan dan Pendapatan Usaha&amp;lt;/em&amp;gt;. Analisis dilakukan dengan metode regresi linear berganda menggunakan data laporan keuangan triwulanan dan tahunan periode 2022&amp;ndash;2025. Uji normalitas dilakukan dengan Shapiro-Wilk dan Kolmogorov-Smirnov, sedangkan uji heteroskedastisitas dilakukan dengan Breusch-Pagan dan Glejser. Hasil penelitian diharapkan memberikan gambaran mengenai validitas model regresi dalam menjelaskan faktor-faktor fundamental yang memengaruhi laba perusahaan.&amp;lt;/p&amp;gt;</dc:description>
