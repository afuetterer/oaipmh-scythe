          <ListRecords>
            <record>
              <header>
                <identifier>oai:zenodo.org:20589672</identifier>
                <datestamp>2026-06-08T07:42:23Z</datestamp>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>liu, xudong</dc:creator>
                  <dc:creator>liu, gaoyuan</dc:creator>
                  <dc:creator>wang, fang</dc:creator>
                  <dc:date>2026-06-08</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;&amp;lt;span&amp;gt;Abstract:&amp;lt;/span&amp;gt;&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;span&amp;gt;This paper proposes a topological origin for gauge field theory: when quantum entanglement crosses a critical threshold, it forms a stable &amp;ldquo;knot&amp;rdquo;-like topological structure in three-dimensional space. The geometric rigidity unique to three dimensions (Thurston&amp;rsquo;s conjecture) and the ADE classification jointly constrain its symmetries to a finite set, with SU(5) being the smallest possible group capable of accommodating the Standard Model. However, SU(5) cannot guarantee the conservation of topological charge and chiral locking in 3+1-dimensional spacetime, leading to problems such as proton decay. Upgrading to SO(10) naturally achieves B-L conservation and a 16-dimensional spinor representation, satisfying the synergistic requirements of entanglement number conservation, the arrow of time, and chirality. We further propose that &amp;gamma;&amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;⁵&amp;lt;/span&amp;gt;&amp;lt;span&amp;gt; is the projection of the regular dodecahedral symmetry group Ih onto the spinor space, with chirality arising from the spatial orientation of the 5-fold symmetry. The principle of minimal action manifests as the &amp;ldquo;convexity&amp;rdquo; selection of topologically stable paths. Ultimately, we argue that gauge fields are the inevitable expression of 3+1-dimensional topological order, and SO(10) is the only unifying group compatible with the observable world.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Note: The term &amp;ldquo;principle of least action&amp;rdquo; is used for historical reasons; the current formulation refers to the &amp;ldquo;best possible stable action.&amp;rdquo;&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20589672</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20589672</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.5281/zenodo.20589671</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:title>What is the Need for Gauge Field Theory? (Outline 9)</dc:title>
                  <dc:type>info:eu-repo/semantics/other</dc:type>
                </oai_dc:dc>
              </metadata>
            </record>
