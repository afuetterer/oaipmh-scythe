                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>N. Thilagavathi*1, Sampoornam W.2 and P. Padmavathi3</dc:creator>
                  <dc:date>2024-06-01</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;Parental alcoholism can impact children in both indirect and direct ways. This study aimed to investigate the effectiveness of problem focused strategies on maladjustment among children of alcoholics at Thindal Community Area, Erode. After obtaining written informed assent/consent, children of alcoholics subjects who fulfilled the inclusion criteria were selected. The total sample size was 60. Multi stage sampling technique was used to recruit the study subjects. CAST screening test was used to identify children of alcoholics. The CAST score above 3 was considered as the sample in this study.&amp;lt;/span&amp;gt;&amp;lt;span&amp;gt; &amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;All participants were interviewed before intervention by assessing demographic variables. The levels of maladjustment were assessed by Mathew maladjustment inventory followed by intervening recognizing problems related to parental alcoholism. From the study findings it can be concluded that administration of recognizing problems related to parental alcoholism reduces maladjustment among children of alcoholics.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19365785</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19365785</dc:identifier>
                  <dc:language>eng</dc:language>
                  <dc:publisher>EJPMR</dc:publisher>
                  <dc:relation>https://doi.org/10.5281/zenodo.19365784</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>EUROPEAN JOURNAL OF PHARMACEUTICAL AND MEDICAL RESEARCH, 11(5), 613-616, (2024-06-01)</dc:source>
                  <dc:title>EFFECTIVENESS OF RECOGNIZING PROBLEMS RELATED TO PARENTAL ALCOHOLISM ON MALADJUSTMENT AMONG CHILDREN OF ALCOHOLICS IN THINDAL COMMUNITY AREA AT ERODE</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
