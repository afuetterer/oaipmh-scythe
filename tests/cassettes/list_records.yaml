                  <dc:description>&amp;lt;h3&amp;gt;Abstract&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;This study was designed to describe the incidence of cancer in southern Iraq, specifically Muthanna City, over a ten-year period from 2014 to 2023. The study relied on statistics from the Ministry of Health, the Iraqi Cancer Council, and the Muthanna Health Directorate. The study focused on leukemia, a common cancer among children. The study showed a significant increase over this ten-year period, with a greater impact on females and children being more affected than adults.&amp;lt;/p&amp;gt;</dc:description>
