                      <familyName>Aman Desai</familyName>
                    </creator>
                  </creators>
                  <titles>
                    <title>pymcabc: A Particle Physics Toy Toolbox for the ABC Model</title>
                  </titles>
                  <publisher>Zenodo</publisher>
                  <publicationYear>2023</publicationYear>
                  <dates>
                    <date dateType="Issued">2023-10-10</date>
                    <date dateType="Updated">2023-10-12</date>
                  </dates>
                  <resourceType resourceTypeGeneral="Text">Presentation</resourceType>
                  <identifier identifierType="DOI">10.5281/zenodo.8435818</identifier>
                  <relatedIdentifiers>
                    <relatedIdentifier relationType="IsVersionOf" relatedIdentifierType="DOI">10.5281/zenodo.8435817</relatedIdentifier>
                  </relatedIdentifiers>
                  <rightsList>
                    <rights rightsURI="https://creativecommons.org/licenses/by/4.0/legalcode" rightsIdentifierScheme="spdx" rightsIdentifier="cc-by-4.0">Creative Commons Attribution 4.0 International</rights>
                    <rights rightsURI="info:eu-repo/semantics/openAccess"/>
                  </rightsList>
                  <descriptions>
                    <description descriptionType="Abstract">We present the pymcabc software which is a High Energy Physics toy toolkit for the ABC model. The ABC model is a pedagogical model that consists of three scalar particles of arbitrary masses. The only interaction among these particles occurs when all three of them are present together. The pymcabc software can calculate all the leading-order cross-sections as well as decay widths within the ABC model. The software can be used as an Event Generator to simulate all the scattering processes within the ABC model. Moreover, it simulates the decays associated with the heavy-particle final state, leading to a 2→3 or a 2→4 type final states within the ABC model. We also apply toy gaussian detector effects to simulate the detector response of a toy tracker for three-momentum measurements and a toy calorimeter for energy measurements. Using the results of the pymcabc software, we have also illustrated some well-known physics analyses techniques such as the analysis of the lineshape of a heavy propagator and recoil mass reconstruction.</description>
                  </descriptions>
                </resource>
              </metadata>
            </record>
