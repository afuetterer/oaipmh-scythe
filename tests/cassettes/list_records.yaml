              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Jamile Wayne Ferreira</dc:creator>
                  <dc:creator>Carolina Wudich Borba</dc:creator>
                  <dc:date>2025</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;O trabalho culin&amp;aacute;rio e de costura s&amp;atilde;o atividades historicamente designadas &amp;agrave;s mulheres, considerando isso, o artigo busca, nas dimens&amp;otilde;es hist&amp;oacute;ricas e socioculturais da experi&amp;ecirc;ncia das mulheres das classes populares, formas de pensar a culin&amp;aacute;ria e a costura. A divis&amp;atilde;o sexual do trabalho estabeleceu uma hierarquia simb&amp;oacute;lica, relegando o trabalho feminino ao &amp;acirc;mbito dom&amp;eacute;stico e &amp;agrave; invisibilidade, enquanto o trabalho masculino equivalente, como o do alfaiate e do chef, alcan&amp;ccedil;ava prest&amp;iacute;gio e valoriza&amp;ccedil;&amp;atilde;o. Por meio de uma an&amp;aacute;lise que considera os recortes de g&amp;ecirc;nero e ra&amp;ccedil;a, o artigo prop&amp;otilde;e a artesania e a educa&amp;ccedil;&amp;atilde;o popular feminista como caminhos pedag&amp;oacute;gicos para a emancipa&amp;ccedil;&amp;atilde;o das mulheres e a constru&amp;ccedil;&amp;atilde;o de outros sentidos para a culin&amp;aacute;ria e a costura. Atrav&amp;eacute;s da experi&amp;ecirc;ncia nos projetos Quitutes Mirabal e Mulheres Mil e da viv&amp;ecirc;ncia como educadoras popular, procuramos olhar para o saber-fazer e a manualidade a partir da ideia de que o trabalho ordin&amp;aacute;rio pode ser um campo de criatividade, autonomia e fortalecimento coletivo, permitindo que as mulheres se reconhe&amp;ccedil;am como sujeitas ativas e produtoras de sua pr&amp;oacute;pria hist&amp;oacute;ria.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19355137</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19355137</dc:identifier>
                  <dc:publisher>UFPel</dc:publisher>
