              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Prasadi Zoysa, Kanakarathnage Kavindya</dc:creator>
                  <dc:creator>Hasindu Geethal, Benthota Hewage</dc:creator>
                  <dc:creator>Kottahachchi, Darshana Udakara</dc:creator>
                  <dc:creator>Ratnamalala, Visaka</dc:creator>
                  <dc:date>2025-09-23</dc:date>
                  <dc:description>&amp;lt;h3&amp;gt;Abstract&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;Hemophilia A is the most common hereditary coagulation disorder, resulting from a deficiency of clotting Factor VIII, which increases the risk of excessive bleeding and bruising. As an inclusive treatment, Factor VIII replacement therapy is given in the management of Hemophilia A. Prophylaxis has become the primary treatment, focusing on maintaining a baseline Factor VIII level to proactively prevent bleeding episodes. While this therapy has significantly improved patient outcomes, a major challenge remains in determining its efficiency over time. Factor VIII levels tend to decline unpredictably. The standard method for monitoring Factor VIII levels involves Factor assay, but the high cost and limited availability make routine use impractical, especially in resource-limited settings. This uncertainty in monitoring therapy effectiveness leaves patients vulnerable to spontaneous bleeding episodes and complicates clinical decision-making regarding optimal dosing intervals. Given this challenge, an alternative, cost-effective method is necessary to predict the efficiency of Factor VIII replacement therapy. This review aimed to explore the potential use of the activated partial thromboplastin time test (aPTT) as a predictive marker for Factor VIII decay. By establishing a correlation between aPTT and Factor VIII levels, a practical and accessible diagnostic approach can be developed to optimize treatment regimens. Additionally, this review aimed to assess the ability of aPTT to predict Factor VIII levels in Hemophilia A patients, emphasizing the significance of diagnostic strategies in enhancing patient outcomes and ensuring more efficient use of therapeutic resources.&amp;nbsp;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.58614/jahsm593</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20568304</dc:identifier>
                  <dc:identifier>https://www.jpub.org/article-details.php?article-id=246</dc:identifier>
                  <dc:identifier>issn:2583-1887</dc:identifier>
                  <dc:language>eng</dc:language>
                  <dc:publisher>Jagua Publication</dc:publisher>
                  <dc:relation>https://zenodo.org/communities/jahsm/</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>Journal of Applied Health Sciences and Medicine, 5(9), 16-23, (2025-09-23)</dc:source>
                  <dc:subject>Hemophilia A, Factor VIII replacement therapy, Activated Partial Thromboplastin Time Test, Factor VIII level.</dc:subject>
                  <dc:title>Evaluating the Predictive Value of Activated Partial Thromboplastin Time Test in Monitoring Factor VIII Therapy in Hemophilia A Patients</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
              </metadata>
