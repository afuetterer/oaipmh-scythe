                  <dc:source>The National Confrence on :  VIKSIT BHARAT @ 2047 : Strategies for inclusive and sustainable global sectoral transformation of India, Agra</dc:source>
                  <dc:title>Jam Trinity: A Study On Three Pillars Of Digital  Financial Inclusion</dc:title>
