                  <dc:creator>Thomas, William</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p class="MsoNormal"&amp;gt;Compared to their free-ranging counterparts, wild animals in captivity are subject to different conditions with lasting effects on their physiology and behavior. Alterations in gene expression in response to environmental changes occur upstream of physiological and behavioral phenotypes, but there are no experiments analyzing differential gene expression in captive vs. free-ranging mammals. We assessed gene expression profiles of three brain regions (cortex, olfactory bulb, and hippocampus) of wild juvenile shrews (&amp;lt;em&amp;gt;Sorex araneus&amp;lt;/em&amp;gt;) in comparison to shrews kept in captivity for two months. We found hundreds of differentially expressed genes in all three brain regions, suggesting a large and uniform captivity effect. Many of the downregulated genes in captive shrews significantly enrich pathways associated with neurodegenerative disease (p&amp;lt;0.001), oxidative phosphorylation (p&amp;lt;0.001), and genes encoding ribosomal proteins (p&amp;lt;0.001). Transcriptomic changes associated with captivity in the shrew resemble responses identified in several human pathologies, such as major depressive disorder and neurodegeneration. Thus, not only does captivity impact brain function and expression, but captivity effects may also confound analyses of natural physiological processes in wild individuals under captive conditions.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:description>&amp;lt;p&amp;gt;Funding provided by: Human Frontier Science Program&amp;lt;br&amp;gt;Crossref Funder Registry ID: http://dx.doi.org/10.13039/501100000854&amp;lt;br&amp;gt;Award Number: RGP0013/2019&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Funding provided by: Hearst Foundations&amp;lt;br&amp;gt;Crossref Funder Registry ID: http://dx.doi.org/10.13039/100000933&amp;lt;br&amp;gt;Award Number: &amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5061/dryad.qz612jmng</dc:identifier>
                  <dc:identifier>oai:zenodo.org:8434673</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.5281/zenodo.8408014</dc:relation>
                  <dc:relation>https://zenodo.org/communities/dryad/</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Zero v1.0 Universal</dc:rights>
                  <dc:rights>https://creativecommons.org/publicdomain/zero/1.0/legalcode</dc:rights>
                  <dc:subject>captivity</dc:subject>
                  <dc:subject>RNAseq</dc:subject>
                  <dc:subject>Brain</dc:subject>
                  <dc:subject>shrew</dc:subject>
                  <dc:title>Large captivity effect based on gene expression comparisons between captive and wild shrew brains</dc:title>
