                <datestamp>2026-06-10T10:26:11Z</datestamp>
                <setSpec>software</setSpec>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Sandya9876</dc:creator>
                  <dc:date>2026-06-10</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;GraphContrast-IoT is a self-supervised graph neural network framework for anomaly detection in multivariate IoT sensor networks. The framework integrates hybrid graph construction, graph convolutional learning, temporal sequence modeling, and contrastive representation learning to detect anomalies without requiring labeled attack or fault data.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;The proposed GCT-ADNet architecture combines:&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;• Hybrid Graph Construction (Topology + Correlation)
        • Graph Neural Networks (GCN/GAT)
        • Temporal Modeling (GRU/TCN)
        • Multi-View Contrastive Learning
        • Embedding-Based Anomaly Detection&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;GraphContrast-IoT learns robust spatio-temporal sensor representations through self-supervised learning and supports industrial IoT anomaly detection tasks in cyber-physical systems where anomaly labels are scarce or unavailable.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Key Features:
        • Self-supervised anomaly detection
        • Multi-view graph augmentations
        • Contrastive representation learning using InfoNCE
        • Hybrid topology-aware graph construction
        • End-to-end PyTorch Geometric implementation
        • Reproducible experimental pipeline
        • Support for SWaT, WADI, and SKAB benchmark datasets&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Applications:
        • Industrial IoT Monitoring
        • Smart Manufacturing
        • Critical Infrastructure Protection
        • Predictive Maintenance
        • Sensor Fault Detection
        • Cyber-Physical Security&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;This release contains the complete source code, training pipeline, evaluation scripts, experiment configurations, and documentation required to reproduce the GraphContrast-IoT framework.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20625406</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20625406</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://github.com/Sandya9876/GraphContrast-IoT/tree/v1</dc:relation>
                  <dc:relation>https://doi.org/10.5281/zenodo.20625405</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>MIT License</dc:rights>
                  <dc:rights>https://opensource.org/licenses/MIT</dc:rights>
                  <dc:title>Sandya9876/GraphContrast-IoT: GraphContrast-IoT: A Contrastive Self-Supervised GCT-ADNet Framework for Robust Time-Series Anomaly Detection in IoT Sensor Data</dc:title>
                  <dc:type>info:eu-repo/semantics/other</dc:type>
                </oai_dc:dc>
