              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Larwubah</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Diabetic retinopathy (DR) is a condition caused by damage to the blood vessels in the retina, leading to abnormal blood vessel growth, swelling, and leakage. Salvia miltiorrhiza (SM), a traditional Chinese herb used for medicinal purposes, has shown potential benefits for treating DR due to its antioxidant, anti-inflammatory, vasodilatory, and anti-angiogenic effects. Yet, the molecular mechanism underlying SM&amp;rsquo;s therapeutic effects on DR is unclear. To address this issue, the current study used network pharmacology and molecular docking techniques to identify and validate potential mechanisms involved in SM&amp;rsquo;s treatment of DR.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Active constituents of SM were retrieved from the TCMSP, and DR-associated targets were collected from the GeneCards and Diaretinopathy databases. Overlapping targets between SM constituents and DR-associated targets were utilized to create the salvia miltiorrhiza constituents target-diabetic retinopathy network and protein-protein interaction network. Gene enrichment analysis identified potential therapeutic SM mechanisms in DR treatment, including biological processes, cellular components, molecular functions, and signaling pathways. Docking results confirmed stable interactions between SM constituents and DR targets.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;The study offers possible molecular mechanisms for treating DR using SM and suggests further wet lab experiments to corroborate the computational analysis findings. The findings provide a basis for additional research and the potential development of SM-based therapies for DR.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.8433947</dc:identifier>
                  <dc:identifier>oai:zenodo.org:8433947</dc:identifier>
                  <dc:language>ang</dc:language>
