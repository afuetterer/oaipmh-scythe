                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;span class="fontstyle0"&amp;gt;В данной статье приведен анализ отечественной и зарубежной литературы о хронических&amp;lt;br&amp;gt;неинфекционных заболеваниях, таких как: сердечно-сосудистые, сахарный диабет, хронические респираторные. Показаны причины низкой приверженности пациентов к лечению, которые связаны непосредственно с самим пациентом, с заболеванием, с системой здравоохранения и недостаточной коммуникацией между врачом и пациентом. Успешное управление&amp;lt;br&amp;gt;этими хроническими заболеваниями требует не только эффективной медицинской терапии,&amp;lt;br&amp;gt;но и активного участия пациента в процессе лечения. Ключевым фактором, определяющим&amp;lt;br&amp;gt;эффективность лечения хронических неинфекционных заболеваний, является приверженность к лечению.&amp;lt;/span&amp;gt;&amp;nbsp;&amp;lt;/p&amp;gt;</dc:description>
