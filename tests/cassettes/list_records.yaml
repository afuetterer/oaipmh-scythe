                  <dc:creator>Butler, R.</dc:creator>
                  <dc:creator>Odoi, A.</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Since the 2017 discovery of established populations of the Asian longhorned tick, (&amp;lt;em&amp;gt;Haemaphysalis longicornis &amp;lt;/em&amp;gt;Neumann) in the United States, populations continue to be detected in new areas. For this exotic and invasive species, capable of transmitting a diverse repertoire of pathogens and blood-feeding on a variety of host species, there remains a lack of targeted information on how to best prepare for this tick and understand when and where it occurs. To fill this gap, we conducted two years of weekly tick surveillance at four farms in Tennessee (three &amp;lt;em&amp;gt;H. longicornis&amp;lt;/em&amp;gt;-infested and one without) to identify environmental factors associated with each questing life stage, to investigate predictors of abundance, and to determine the likelihood of not collecting ticks at different life stages. A total of 46,770 ticks were collected, of which 12,607 &amp;lt;em&amp;gt;H. longicornis&amp;lt;/em&amp;gt; and five other tick species were identified. Overall, abundance of &amp;lt;em&amp;gt;H. longicornis &amp;lt;/em&amp;gt;was associated with spring and summer seasons, forested environments, relative humidity and barometric pressure, sunny conditions, and in relation with other tick species. The likelihood of not collecting &amp;lt;em&amp;gt;H. longicornis&amp;lt;/em&amp;gt; was associated with day length and barometric pressure. Additional associations for different life stages were also identified and included other tick species, climatic variables, and environmental conditions. Here, we demonstrated that environmental variables can be useful to predict the presence of questing &amp;lt;em&amp;gt;H. longicornis&amp;lt;/em&amp;gt; and provide ideas on how to use this information to develop a surveillance plan for different southeastern areas with and without infestations.&amp;lt;/p&amp;gt;</dc:description>
