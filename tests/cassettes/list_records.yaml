                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Munashe Masomeke</dc:creator>
                  <dc:date>2026-06-10</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Formal predictive analysis remains limited in tobacco-dependent economies, where forecasting has largely relied on ARIMA-type time-series models. While widely used, these models impose linearity assumptions that restrict their ability to capture key structural drivers of production. This limitation is evident in recent studies where an ARIMA (1,1,0) model projected Zimbabwean tobacco yield at 1,511.78 kg/ha for 2023, underestimating the observed yield of 2,278 kg/ha by approximately 50.7% [1]. Export forecasting is even less developed, with most existing studies remaining descriptive rather than predictive. The paper reviewed the literature related to tobacco yield forecasting, agricultural export modelling and the application of Machine Learning in crop prediction and trade intelligence systems. Data from across the fields confirm that the Machine Learning techniques Ridge Regression, Random Forest and Gradient Boosting offer superior results to statistical models. The analysis points out three main gaps. First, Machine Learning methods have not been widely applied to tobacco production in sub-Saharan Africa. Second, there is no formal export forecasting model for Zimbabwe that accounts for its multi-year shipment patterns. Third, there is no integrated framework that jointly modelsyield and exports within a unified decision-support system. These gaps highlight the need for more comprehensive, data-driven approaches to forecasting in the tobacco sector.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5121/ijdkp.2026.16301</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20626449</dc:identifier>
