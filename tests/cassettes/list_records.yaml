            <record>
              <header>
                <identifier>oai:zenodo.org:20602395</identifier>
                <datestamp>2026-06-09T00:45:20Z</datestamp>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Francisquete, Maila</dc:creator>
                  <dc:date>2026-06-09</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This study explored the lived experiences, coping mechanisms, and&amp;nbsp;educational management insights of Information and Communication Technology (ICT)&amp;nbsp;teachers in integrating digital boards as instructional tools in place of traditional&amp;nbsp;chalkboards. Specifically, it aimed to describe teachers&amp;rsquo; experiences in ICT integration,&amp;nbsp;identify their coping strategies in addressing technological challenges, and derive&amp;nbsp;educational management insights for effective implementation of digital teaching tools.&amp;lt;br&amp;gt;The study employed a qualitative phenomenological research design, utilizing thematic&amp;nbsp;analysis to interpret the lived experiences of participants. Data were gathered through&amp;nbsp;in-depth interviews (IDI) with ten (10) Information and Communication Technology&amp;nbsp;(ICT) teachers from junior high schools in Caraga, Davao Oriental, who had actively&amp;nbsp;integrated digital tools into their teaching. Thematic analysis was used to systematically&amp;nbsp;identify, analyze, and interpret recurring themes and sub-themes from the participants&amp;rsquo;&amp;nbsp;narratives. Findings revealed that teachers initially experienced technical difficulties, fear,&amp;nbsp;and uncertainty during the transition from chalkboards to digital boards but gradually&amp;nbsp;adapted through continuous learning and practice. Their instructional practices shifted&amp;nbsp;toward interactive, multimedia-based, and learner-centered approaches, resulting in&amp;nbsp;improved lesson delivery and increased student engagement, motivation, and confidence.&amp;nbsp;In coping with challenges, teachers relied on self-directed learning, peer collaboration,&amp;nbsp;institutional training, and flexible classroom management strategies, which enhanced&amp;lt;br&amp;gt;their competence and resilience. Educational management insights emphasized the&amp;nbsp;critical role of transformational leadership, continuous professional development,&amp;nbsp;adequate ICT resources, and strong technical support systems in sustaining effective ICT&amp;lt;br&amp;gt;integration. The study recommends strengthening transformational leadership, providing&amp;nbsp;continuous and contextualized ICT training, establishing structured mentoring programs,&amp;nbsp;and ensuring sustainable ICT infrastructure to support long-term and effective integration&amp;nbsp;of digital technologies in education.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20602395</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20602395</dc:identifier>
                  <dc:language>eng</dc:language>
