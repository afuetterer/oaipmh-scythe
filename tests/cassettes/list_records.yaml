              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Hillazar, Aristita</dc:creator>
                  <dc:date>2026-06-03</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This phenomenological study explored how ten Grade Three teachers from&amp;nbsp;five public elementary schools in the Maa District of Davao City navigated classroom&amp;nbsp;diversity through differentiated instruction within resource constrained and overcrowded&amp;nbsp;classrooms. It aimed to describe their lived experiences implementing differentiated&amp;nbsp;instruction, the coping strategies they employed to address challenges, and the&amp;nbsp;educational insights they gained to enhance teaching practices. Findings revealed four&amp;nbsp;experiential themes: differentiated instruction as daily adaptive practice, emotional labor&amp;nbsp;and teacher resilience, observable impact on student engagement and transformation, and&amp;nbsp;teacher empowerment through student-centered facilitation. Coping strategies included&amp;nbsp;collaborative resource sharing, improvisation with local and low-cost materials, flexible&amp;nbsp;classroom management, and reflective practice. Educational insights generated a&amp;nbsp;blueprint for sustainable differentiation comprising context responsive professional&amp;nbsp;development, systemic support, collaborative professional learning communities, and&amp;nbsp;student-centered assessment. This study contributes to Sustainable Development Goal 4&amp;nbsp;by promoting inclusive and equitable quality education. The Department of Education&amp;nbsp;may provide reduced class sizes, dedicated planning time, consistent resources, and&amp;nbsp;strengthened Learning Action Cells.&amp;nbsp;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20518803</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20518803</dc:identifier>
                  <dc:language>eng</dc:language>
