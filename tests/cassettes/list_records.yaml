        &amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;
        
        
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Full changelog:&amp;lt;/strong&amp;gt; &amp;lt;a href="CHANGELOG.md"&amp;gt;CHANGELOG.md&amp;lt;/a&amp;gt;
        &amp;lt;strong&amp;gt;Zenodo DOI:&amp;lt;/strong&amp;gt; https://doi.org/10.5281/zenodo.XXXXXXX &amp;lt;em&amp;gt;(update after publishing to Zenodo)&amp;lt;/em&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
