                  <dc:creator>Octave Tessiot</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;This file contains datasets associated with the research article &amp;quot;Cold waves likely never to happen again&amp;quot;. All data (observations and CMIP6 models) needed to reproduce key results of this paper are included here.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;&amp;nbsp;&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Data is spread over 4 directories, one for each event considered (Europe, China, Brazil, Texas).&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Each directory contains inputs and outputs.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Directory &amp;#39;input&amp;#39; includes time-series of:&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- CMIP6 model data for the covariate X,&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- CMIP6 model data for the variable Y used to define the event (eg TMn10d for Europe),&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- (pseudo-)observations from ERA5 for the covariate X,&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- (pseudo-)observations from ERA5 for the variable Y used to define the event (eg, TMn10d for Europe).&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;&amp;nbsp;&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Directory &amp;#39;ouput&amp;#39; includes the key results from the statistical analysis:&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- Summary_CXCB.txt provides key numbers for probability and intensity of the events, in the factual and counter-factual world.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- *paramsCXCB.nc provides the time-series of the fitted (posterior distribution) GEV coefficients (mu,sigma,xi).&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;- *climCXCB.nc provides details about the event definition, the fitted non-stationary GEV parameters, the covariate X, and key outpus such as the estimated probability and intensity of the event.&amp;lt;/p&amp;gt;</dc:description>
