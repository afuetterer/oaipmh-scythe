              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Molina-Burgos, Francisco</dc:creator>
                  <dc:date>2026-06-14</dc:date>
                  <dc:description>rz3 is a pure-Rust SMT (Satisfiability Modulo Theories) solver built on a DPLL(T)/CDCL architecture. It computes over arbitrary-precision rationals (no floating-point in the decision core), is deterministic run-to-run (verified by an n=30 bit-identical harness), and has zero native dependencies, so it deploys to WebAssembly. Its linear-arithmetic core is complete and unconditionally terminating: strict inequalities use a symbolic delta-infinitesimal (Dutertre-de Moura) and the feasibility Simplex avoids cycling via a lexicographic epsilon-perturbation. Dual-licensed under MIT OR Apache-2.0.</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20686623</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20686623</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
