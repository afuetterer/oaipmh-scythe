                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:title>Software gFlex_load_SE for Glacial Isostatic Adjustment impact on Western Alps</dc:title>
                  <dc:type>info:eu-repo/semantics/other</dc:type>
                </oai_dc:dc>
              </metadata>
            </record>
            <record>
              <header>
                <identifier>oai:zenodo.org:8406062</identifier>
                <datestamp>2023-10-12T00:32:03Z</datestamp>
                <setSpec>user-dryad</setSpec>
                <setSpec>software</setSpec>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Aglissi, Janvier</dc:creator>
                  <dc:creator>A. Etotépé, Sogbohossou</dc:creator>
                  <dc:creator>Bauer, Hans</dc:creator>
                  <dc:date>2023-10-11</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;span&amp;gt;The civil war in Côte d'Ivoire led to a hike in human disturbances and the extirpation of the African lion (&amp;lt;em&amp;gt;Panthera&amp;lt;/em&amp;gt; &amp;lt;em&amp;gt;leo&amp;lt;/em&amp;gt;) from the Comoé National Park (CNP). After the war, many efforts have been made to restore this ecosystem and management is considering the reintroduction of lions. In participatory management with people at the center of conservation, there is a need to discuss with communities the initiatives affecting their livelihoods. We assessed the acceptance of lion reintroduction by the local communities; through semi-structured questionnaires to 307 volunteer participants in surrounding 23 villages. Most respondents had knowledge of lions from CNP (93%, n=286). A generalized linear model (GLM) revealed that &amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;sex, profession, perceived benefits and risks, and an appreciation of the current management system are the main significant determinants for the acceptance of lion reintroduction in CNP.&amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;  A large majority (73%, n=223) were in favor of the lion reintroduction with significant variance among socio-professional categories. The majority of respondents (81%, n=250) acknowledged having coexisted with lions, with previous lion conflicts reported by 20% (n = 61), and a willingness to coexist in the future by 74% (n = 227). More than 84% (n=260) believed that there would be benefits associated with lion reintroduction to CNP and 53% (n=162) believed that the potential benefits would be greater than the possible risks associated with lions. Most respondents (88%; n=270) confirmed the possibility of taking precautions to prevent future lion attacks. While only 42% (n = 129) of respondents felt that current management was participatory, most of them felt that it was acceptable (83%; n = 254). &amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;Our data shows a large degree of lion support, positive perceptions, and willingness to coexist with lions in the future. These results form part of a fundamental step in the direction for ethical reintroduction, as described by the IUCN reintroduction specialist group&amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;. &amp;lt;/span&amp;gt;&amp;lt;span&amp;gt;We recommend the improvement of the involvement of indigenous communities in potential reintroduction of lions, especially the pastoralists, and the sharing of any associated benefits.&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:description>&amp;lt;p&amp;gt;Funding provided by: International Union for Conservation of Nature*&amp;lt;br&amp;gt;Crossref Funder Registry ID: &amp;lt;br&amp;gt;Award Number: AVBF-00072&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Funding provided by: German Technical Cooperation (GIZ of Côte d&amp;#39;Ivoire)*&amp;lt;br&amp;gt;Crossref Funder Registry ID: &amp;lt;br&amp;gt;Award Number: VN 1508-290- 22&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.8406062</dc:identifier>
                  <dc:identifier>oai:zenodo.org:8406062</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.22541/au.167303812.29090197/v1</dc:relation>
                  <dc:relation>https://doi.org/10.5061/dryad.9w0vt4bnd</dc:relation>
                  <dc:relation>https://zenodo.org/communities/dryad/</dc:relation>
                  <dc:relation>https://doi.org/10.5281/zenodo.8406061</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>MIT License</dc:rights>
                  <dc:rights>https://opensource.org/licenses/MIT</dc:rights>
                  <dc:subject>Databases</dc:subject>
                  <dc:subject>Acceptance of lion reintroduction in Comoé National Park</dc:subject>
                  <dc:subject>Côte d'Ivoire</dc:subject>
                  <dc:subject>West Africa</dc:subject>
                  <dc:title>Dataset of: Community perspectives on the prospect of lion (Panthera leo) reintroduction to Comoé National Park, Côte d'Ivoire (West Africa)</dc:title>
                  <dc:type>info:eu-repo/semantics/other</dc:type>
                </oai_dc:dc>
              </metadata>
            </record>
