                  <dc:source>D'GENERUS: Revista de Estudos Feministas e de Gênero, 3/4(2024/2025), 49-64, (2025)</dc:source>
                  <dc:title>O artesanal e o ordinário: tramas e pitadas da experiência das mulheres com o trabalho</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
