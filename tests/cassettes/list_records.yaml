                  <dc:description>&amp;lt;p&amp;gt;O presente trabalho tem como objetivo analisar a efetividade do Acordo Setorial de Embalagens no Brasil, firmado no &amp;acirc;mbito da Pol&amp;iacute;tica Nacional de Res&amp;iacute;duos S&amp;oacute;lidos (PNRS/2010) e regulamentado pelos Decretos Federais n&amp;ordm; 11.043/22 e n&amp;ordm; 11.413/23. O estudo concentra-se no processo de inclus&amp;atilde;o socioprodutiva dos catadores e catadoras de materiais recicl&amp;aacute;veis, em especial daqueles vinculados a organiza&amp;ccedil;&amp;otilde;es apoiadas por entidades gestoras de cr&amp;eacute;ditos de log&amp;iacute;stica reversa. Conclui-se que a efetividade do Acordo Setorial de Embalagens no Brasil deve ser analisada n&amp;atilde;o apenas sob a &amp;oacute;tica do cumprimento de metas quantitativas de reciclagem, mas tamb&amp;eacute;m considerando sua capacidade de transformar realidades sociais e garantir a dignidade dos catadores.&amp;lt;br&amp;gt;Palavras-chaves: sustentabilidade; justi&amp;ccedil;a ambiental; res&amp;iacute;duos s&amp;oacute;lidos.&amp;lt;/p&amp;gt;</dc:description>
