                    <relatedIdentifier relationType="IsCitedBy" relatedIdentifierType="DOI">10.22541/au.167303812.29090197/v1</relatedIdentifier>
                    <relatedIdentifier relationType="IsSourceOf" relatedIdentifierType="DOI">10.5061/dryad.9w0vt4bnd</relatedIdentifier>
                    <relatedIdentifier relationType="IsVersionOf" relatedIdentifierType="DOI">10.5281/zenodo.8406061</relatedIdentifier>
                  </relatedIdentifiers>
                  <rightsList>
                    <rights rightsURI="https://opensource.org/licenses/MIT" rightsIdentifierScheme="spdx" rightsIdentifier="mit">MIT License</rights>
                    <rights rightsURI="info:eu-repo/semantics/openAccess"/>
                  </rightsList>
                  <descriptions>
                    <description descriptionType="Abstract">The civil war in Côte d'Ivoire led to a hike in human disturbances and the extirpation of the African lion (Panthera leo) from the Comoé National Park (CNP). After the war, many efforts have been made to restore this ecosystem and management is considering the reintroduction of lions. In participatory management with people at the center of conservation, there is a need to discuss with communities the initiatives affecting their livelihoods. We assessed the acceptance of lion reintroduction by the local communities; through semi-structured questionnaires to 307 volunteer participants in surrounding 23 villages. Most respondents had knowledge of lions from CNP (93%, n=286). A generalized linear model (GLM) revealed that sex, profession, perceived benefits and risks, and an appreciation of the current management system are the main significant determinants for the acceptance of lion reintroduction in CNP.  A large majority (73%, n=223) were in favor of the lion reintroduction with significant variance among socio-professional categories. The majority of respondents (81%, n=250) acknowledged having coexisted with lions, with previous lion conflicts reported by 20% (n = 61), and a willingness to coexist in the future by 74% (n = 227). More than 84% (n=260) believed that there would be benefits associated with lion reintroduction to CNP and 53% (n=162) believed that the potential benefits would be greater than the possible risks associated with lions. Most respondents (88%; n=270) confirmed the possibility of taking precautions to prevent future lion attacks. While only 42% (n = 129) of respondents felt that current management was participatory, most of them felt that it was acceptable (83%; n = 254). Our data shows a large degree of lion support, positive perceptions, and willingness to coexist with lions in the future. These results form part of a fundamental step in the direction for ethical reintroduction, as described by the IUCN reintroduction specialist group. We recommend the improvement of the involvement of indigenous communities in potential reintroduction of lions, especially the pastoralists, and the sharing of any associated benefits.</description>
                    <description descriptionType="Other">Funding provided by: International Union for Conservation of Nature*Crossref Funder Registry ID: Award Number: AVBF-00072
        Funding provided by: German Technical Cooperation (GIZ of Côte d'Ivoire)*Crossref Funder Registry ID: Award Number: VN 1508-290- 22</description>
                  </descriptions>
                </resource>
