              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Guadalupe-Moyano, Verónica</dc:creator>
                  <dc:creator>Carvache-Franco, Mauricio</dc:creator>
                  <dc:creator>Villagómez-Buele, César</dc:creator>
                  <dc:creator>Carvache-Franco, Orly</dc:creator>
                  <dc:date>2025-12-09</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;La ciudad Libertador Bol&amp;iacute;var en Santa Elena, Ecuador, es un destino tur&amp;iacute;stico costero. El objetivo principal de este estudio es evaluar la calidad de la oferta gastron&amp;oacute;mica de esta comuna. Para ello, se emple&amp;oacute; un enfoque metodol&amp;oacute;gico mixto, combinando herramientas cualitativas y cuantitativas, en esta &amp;uacute;ltima se utilizaron elementos de investigaci&amp;oacute;n como auditor&amp;iacute;a de higiene y auditor&amp;iacute;a de servicio, ambas basadas en la normativa ecuatoriana, adem&amp;aacute;s de una evaluaci&amp;oacute;n microbiol&amp;oacute;gica de los alimentos. Para obtener datos cualitativos, se realizaron entrevistas. Como resultado de la evaluaci&amp;oacute;n de buenas pr&amp;aacute;cticas de higiene en la manipulaci&amp;oacute;n de alimentos, se encontr&amp;oacute; que las principales necesidades de mejora son los equipos y utensilios, el control de tabaco, el control de plagas y las condiciones sanitarias. Asimismo, se identific&amp;oacute; que el personal de los distintos restaurantes cumple el 100% de los requisitos, lo que representa una fortaleza en la oferta gastron&amp;oacute;mica de la comuna. El servicio en los restaurantes obtuvo una calificaci&amp;oacute;n muy buena de 72 + 3%, lo que sugiere la necesidad de mejorar la planificaci&amp;oacute;n del men&amp;uacute; e incluir actualizaciones para garantizar la satisfacci&amp;oacute;n del cliente.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.31876/rcs.v31i4.44872</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19365605</dc:identifier>
                  <dc:language>spa</dc:language>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>Revista de Ciencias Sociales (RCS). Facultad de Ciencias Económicas y Sociales. Universidad del Zulia., 31(4), (2025-12-09)</dc:source>
                  <dc:title>Evaluación de calidad del servicio y condiciones sanitarias en oferta gastronómica de destino turístico costero en Ecuador</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
              </metadata>
