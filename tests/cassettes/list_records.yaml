              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Shokri, Ali</dc:creator>
                  <dc:date>2026-06-12</dc:date>
                  <dc:description>&amp;lt;div&amp;gt;
        &amp;lt;div&amp;gt;Complete data analysis (single self-contained Python script) and input data extracts for the paper "Do runoff models need rainfall? Direct attenuation&amp;ndash;runoff modelling with a commercial microwave link" (Esmaeil Nia and Shokri). The script builds the de-baselined attenuation forcing from raw commercial microwave link received power, calibrates the direct attenuation&amp;ndash;runoff model, the GR4J rainfall benchmark, and their output-level fusion for nine urban catchments in eastern Melbourne, Australia (five-seed multistart differential evolution, split-sample validation), and writes all result tables of the paper. All optimiser seeds are fixed: every published number is exactly reproducible.&amp;lt;/div&amp;gt;
        &amp;lt;br&amp;gt;
        &amp;lt;div&amp;gt;The data zip contains unmodified extracts (June 2026) of hourly discharge and rain-gauge records from the public Melbourne Water "Rainfall and river levels" service; all rights in the underlying data remain with Melbourne Water. The commercial microwave link data are separately archived by their authors at https://doi.org/10.5281/zenodo.3629929 (Pudashine et al., 2020, CC-BY 4.0) and are not duplicated here.&amp;lt;/div&amp;gt;
        &amp;lt;br&amp;gt;
        &amp;lt;div&amp;gt;Code is developed at https://github.com/shokri-ali/attenuation-runoff (MIT licence). Requires Python 3.13 with numpy, pandas, scipy, numba (pinned versions in requirements.txt); runtime roughly 20&amp;ndash;30 minutes.&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;</dc:description>
