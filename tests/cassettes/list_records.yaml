              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Волошенко, Інна Олександрівна</dc:creator>
                  <dc:date>2025-11-25</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Мета дослідження полягає у комплексному аналізі Зангезурського коридору як інфраструктурного проєкту, що набуває доленосного значення для регіональної безпеки та економічної взаємодії на Південному Кавказі. У роботі застосовано системний аналіз, порівняльний метод, геополітичний підхід та метод кейс-стаді, що дозволило дослідити багатовимірність проблематики транспортної інтеграції в умовах постконфліктного врегулювання. Встановлено, що Зангезурський коридор - 42-кілометровий авто- та залізничний маршрут через Сюнікську область Вірменії, який має з'єднати основну територію Азербайджану з ексклавом Нахічевань та Туреччиною, - є одним із центральних елементів трансформації геополітичного балансу на Південному Кавказі. Показано, що проєкт несе значний економічний потенціал: включення коридору до &amp;laquo;Середнього маршруту&amp;raquo; (Trans-Caspian International Transport Route) здатне скоротити час доставки вантажів між Китаєм та ЄС на 5&amp;ndash;10 днів і знизити логістичні витрати на 20&amp;ndash;25%. Водночас реалізація коридору загрожує суверенітету Вірменії, підриває транзитну роль Ірану і обмежує вплив Росії в регіоні, яка стрімко втрачає позиції після 2022 р. Проаналізовано конкурентні ініціативи: вірменська концепція &amp;laquo;Перехрестя миру&amp;raquo; (Crossroads of Peace), турецький залізничний проєкт Карс&amp;ndash;Іґдир&amp;ndash;Нахічевань та іранський &amp;laquo;Аракс-коридор&amp;raquo;. Особливу увагу приділено угоді серпня 2025 р. (Вашингтон), укладеній за посередництвом США, яка передбачає залучення американського оператора до управління &amp;laquo;маршрутом Трампа&amp;raquo; (TRIPP) - нової назви Зангезурського коридору. Зангезурський коридор є водорозділом між двома можливими сценаріями - коридором економічної інтеграції або новим фронтом геополітичного протистояння. Його доля визначатиметься не лише будівництвом інфраструктури, а й здатністю залучених сторін досягнути збалансованого режиму суверенітету, безпеки та економічної вигоди.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19369134</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19369134</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
