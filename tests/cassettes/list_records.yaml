                  <dc:creator>Feng, Zhenxuan</dc:creator>
                  <dc:creator>Ponocko, Jelena</dc:creator>
                  <dc:creator>Milanovic, Jovica</dc:creator>
                  <dc:date>2025-07-01</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Abstract: This paper introduces a demand-side management strategy aimed at minimising power imports from the grid supply point while preserving load composition in scenarios with low-carbon technologies and renewable energy integration. A detailed load modelling framework is developed to account for constant impedance, current, and power loads, as well as induction motors, electric vehicles, and heat pumps, capturing their temporal variability to enhance simulation accuracy in distribution networks with high penetration of low-carbon technologies. The proposed strategy incorporates advanced load payback criteria to maintain load composition before and after management actions, ensuring consistent steady-state and dynamic system behaviour. The study examines the impact of induction motors, electric vehicles, and heat pumps on load controllability, alongside the variability introduced by solar photovoltaics and wind generation. The results demonstrate that demand-side management effectively flattens load profiles, mitigates renewable-induced fluctuations, and enhances load flexibility by dynamically adjusting controllable loads. This approach ensures stable grid operation without compromising post-management load dynamics. The findings emphasise the crucial role of demand-side management in integrating low-carbon technologies, optimising energy efficiency, maximising renewable energy utilisation, and reducing grid stress, ultimately contributing to the sustainable operation of modern power systems.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:description>&amp;lt;p&amp;gt;This version of the manuscript has been accepted for publication in 2025 CIRED conference proceedings after peer review (Author Accepted Manuscript). It is not the final published version (Version of Record) and does not reflect any post-acceptance improvements. The Version of Record is available online at https://doi.org/10.1049/icp.2025.1642&amp;lt;/p&amp;gt;</dc:description>
