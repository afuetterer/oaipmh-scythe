                  <dc:creator>Silva-Adriano, Luis Enrique</dc:creator>
                  <dc:date>2026-01-31</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;nbsp;Este estudio analiza la prevalencia de homicidios vinculados a la violencia criminal&amp;lt;br&amp;gt;en el Centro Forense de Huaquillas, El Oro, durante 2024. Mediante un enfoque mixto&amp;lt;br&amp;gt;cuantitativo-cualitativo, se examinaron registros oficiales de la Polic&amp;iacute;a Nacional del Ecuador,&amp;lt;br&amp;gt;aplicando an&amp;aacute;lisis descriptivo, bibliogr&amp;aacute;fico-documental, estad&amp;iacute;stico y comparativo-hist&amp;oacute;rico para&amp;lt;br&amp;gt;identificar patrones de violencia.Los resultados revelan que el 90% de las v&amp;iacute;ctimas son hombres,&amp;lt;br&amp;gt;con edad promedio entre 18-35 a&amp;ntilde;os, y 95% de nacionalidad ecuatoriana. Las armas de fuego&amp;lt;br&amp;gt;causaron el 78% de las muertes, seguidas por armas blancas (15%) y estrangulamiento (5%).&amp;lt;br&amp;gt;Las modalidades delictivas predominantes incluyen ajuste de cuentas (52%) y sicariato (30%),&amp;lt;br&amp;gt;concentr&amp;aacute;ndose en barrios perif&amp;eacute;ricos cercanos a pasos fronterizos no oficiales con Per&amp;uacute;.Se&amp;lt;br&amp;gt;concluye que la violencia homicida refleja din&amp;aacute;micas del crimen organizado y narcotr&amp;aacute;fico, con&amp;lt;br&amp;gt;patrones sistem&amp;aacute;ticos que implican riesgos de seguridad nacional. Se recomienda fortalecer el&amp;lt;br&amp;gt;sistema de justicia penal mediante pol&amp;iacute;ticas p&amp;uacute;blicas integradas, intensificar la inteligencia&amp;lt;br&amp;gt;criminal y capacidades forenses en la zona fronteriza, y establecer un observatorio de violencia&amp;lt;br&amp;gt;que articule datos forenses, policiales y judiciales para decisiones basadas en evidencia.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.63618/omd/isj/v4/n1/219</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19372814</dc:identifier>
                  <dc:publisher>Innova Science Journal</dc:publisher>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>Innova Science Journal, 4(1), 167-177, (2026-01-31)</dc:source>
                  <dc:subject>Violencia; Seguridad; Perfil de víctimas; Homicidios; Inteligencia Criminal.</dc:subject>
                  <dc:title>Violencia homicida y crimen organizado en contexto fronterizo: Evidencia forense de Huaquillas, Ecuador 2024.</dc:title>
