                  <dc:source>The Journalof Applied Science and Social Science, 16(03), 1044-1047, (2026-04-01)</dc:source>
                  <dc:title>THE ESSENCE AND PSYCHOLOGICAL SIGNIFICANCE OF USING AUTHENTIC MATERIALS IN DEVELOPING LANGUAGE SKILLS IN TEACHING ENGLISH IN GRADES 5-9</dc:title>
