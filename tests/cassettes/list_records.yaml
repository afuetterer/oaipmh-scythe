              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Natália Jácomo Auad</dc:creator>
                  <dc:creator>Nilson Hitoshi Yoshimoto</dc:creator>
                  <dc:creator>Fabiana Andrade Gontijo Cunha</dc:creator>
                  <dc:creator>Márcio Robério Alves da Silva</dc:creator>
                  <dc:date>2026-06-09</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;O cap&amp;iacute;tulo apresenta os fundamentos e os principais atributos da Aten&amp;ccedil;&amp;atilde;o Prim&amp;aacute;ria &amp;agrave; Sa&amp;uacute;de (APS), destacando seu papel como eixo estruturante dos sistemas de sa&amp;uacute;de e porta de entrada preferencial para os usu&amp;aacute;rios. S&amp;atilde;o abordados os conceitos hist&amp;oacute;ricos que moldaram a APS, sua evolu&amp;ccedil;&amp;atilde;o no contexto brasileiro e sua import&amp;acirc;ncia para a organiza&amp;ccedil;&amp;atilde;o das Redes de Aten&amp;ccedil;&amp;atilde;o &amp;agrave; Sa&amp;uacute;de. O texto enfatiza os atributos essenciais &amp;mdash; acesso ao primeiro contato, longitudinalidade, integralidade e coordena&amp;ccedil;&amp;atilde;o do cuidado &amp;mdash; al&amp;eacute;m dos atributos derivados, como orienta&amp;ccedil;&amp;atilde;o familiar, orienta&amp;ccedil;&amp;atilde;o comunit&amp;aacute;ria e compet&amp;ecirc;ncia cultural, fundamentais para uma assist&amp;ecirc;ncia centrada nas necessidades da popula&amp;ccedil;&amp;atilde;o. Tamb&amp;eacute;m discute a atua&amp;ccedil;&amp;atilde;o da Estrat&amp;eacute;gia Sa&amp;uacute;de da Fam&amp;iacute;lia como principal modelo de operacionaliza&amp;ccedil;&amp;atilde;o da APS no Brasil, ressaltando seu potencial para promover cuidado cont&amp;iacute;nuo, preven&amp;ccedil;&amp;atilde;o de agravos e integra&amp;ccedil;&amp;atilde;o entre os diferentes n&amp;iacute;veis assistenciais. Por fim, o cap&amp;iacute;tulo evidencia os desafios enfrentados pela APS, como desigualdades territoriais, fragmenta&amp;ccedil;&amp;atilde;o da assist&amp;ecirc;ncia e limita&amp;ccedil;&amp;otilde;es estruturais, refor&amp;ccedil;ando que o fortalecimento desses atributos &amp;eacute; indispens&amp;aacute;vel para garantir um sistema de sa&amp;uacute;de mais equitativo, resolutivo e eficiente, capaz de oferecer cuidado integral e coordenado aos usu&amp;aacute;rios.&amp;nbsp;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.20616893</dc:identifier>
                  <dc:identifier>oai:zenodo.org:20616893</dc:identifier>
                  <dc:publisher>Instituto Diniz</dc:publisher>
