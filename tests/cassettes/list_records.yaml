                  <dc:rights>Creative Commons Attribution Non Commercial Share Alike 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode</dc:rights>
                  <dc:source>La huella de la identidad femenina en la narrativa colombiana: una lectura psicoanalítica de género en Sabor a mí y Las cuitas de Carlota, 133-150, (2026-06-10)</dc:source>
                  <dc:title>La huella de la identidad femenina en la narrativa colombiana: una lectura psicoanalítica de género en Sabor a mí y Las cuitas de Carlota</dc:title>
