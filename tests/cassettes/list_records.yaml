            <record>
              <header>
                <identifier>oai:zenodo.org:8435696</identifier>
                <datestamp>2023-10-12T14:26:07Z</datestamp>
                <setSpec>user-pyhep2023</setSpec>
                <setSpec>openaire</setSpec>
              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Matteo Marchegiani</dc:creator>
                  <dc:date>2023-10-10</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;A configuration layer for the analysis of CMS data in the NanoAOD format is presented. The framework is based on the columnar analysis of proton-proton collision events with the Coffea Python package and it focuses on configurability and reproducibility of analysis tasks.&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;All the operations needed to extract the relevant information from events are performed by a Coffea processor object that takes the NanoAOD events as input and returns a set of output histograms or arrays.&amp;lt;br&amp;gt;
        PocketCoffea defines a configuration scheme to specify all the parameters and settings of the processor: the datasets definition, object and event selections, Monte Carlo weights, systematic uncertainties and the output histograms characteristics. The configuration layer is user friendly and speeds up the setup of many common analysis tasks.&amp;lt;br&amp;gt;
        A structured processor performing operations that are common among CMS analyses is defined and can be customized with derived processor classes, allowing code sharing between different analyses workflows in a hierarchical structure.&amp;lt;br&amp;gt;
        With its configurable structure, PocketCoffea is a suitable tool to perform any CMS analysis in a highly reproducible, computational efficient and user-friendly way.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.8435696</dc:identifier>
                  <dc:identifier>oai:zenodo.org:8435696</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://zenodo.org/communities/pyhep2023/</dc:relation>
                  <dc:relation>https://doi.org/10.5281/zenodo.8435695</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>PyHEP 2023 Workshop, 9-12 October 2023</dc:source>
                  <dc:title>PocketCoffea: a configuration layer for CMS analyses with Coffea</dc:title>
                  <dc:type>info:eu-repo/semantics/lecture</dc:type>
                </oai_dc:dc>
              </metadata>
            </record>
