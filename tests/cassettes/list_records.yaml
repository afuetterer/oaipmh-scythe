                  <dc:source>The Journalof Applied Science and Social Science, 16(03), 1015-1018, (2026-04-01)</dc:source>
                  <dc:title>INTEGRATION OF PROFESSIONALISM INTO THE PROCESS OF TEACHING RUSSIAN TO STUDENTS OF TECHNICAL SPECIALTIES IN A MULTIETHNIC AUDIENCE</dc:title>
