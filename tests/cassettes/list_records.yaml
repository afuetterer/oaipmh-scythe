                  <dc:rights>Creative Commons Attribution 4.0 International</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>GPHS2025, Global Public Health Summit 2025 and 30th Annual Academic Sessions of the College of Community Physicians of Sri Lanka, Sri Lanka, 13-16 July 2025</dc:source>
                  <dc:subject>Supervision</dc:subject>
                  <dc:subject>Medical Officer of Health</dc:subject>
                  <dc:title>Strengthening the supervision mechanism of Medical Officer of Health areas under Regional Director of Health Services Colombo, Sri Lanka</dc:title>
