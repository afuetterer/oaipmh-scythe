              </header>
              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Matten, Damaris M.</dc:creator>
                  <dc:creator>Mienna, Ida M.</dc:creator>
                  <dc:creator>Bieker, Vanessa C.</dc:creator>
                  <dc:creator>Mishler, Brent D.</dc:creator>
                  <dc:creator>Moen, Victoria S.</dc:creator>
                  <dc:creator>Nygaard, Malene</dc:creator>
                  <dc:creator>Vuorinen, Katariina E. M.</dc:creator>
                  <dc:creator>Bendiksby, Mika</dc:creator>
                  <dc:creator>Martin, Michael D.</dc:creator>
                  <dc:creator>Speed, James D. M.</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Protected areas are one of the main strategic means for conserving biodiversity. Yet, the design of protected areas usually neglects phylogenetic diversity, an important diversity measure. In this paper, we assess the phylogenetic diversity and species richness of vascular plants in Fennoscandian protected areas. We evaluate how much species richness and phylogenetic diversity is found within and outside protected areas, and the differences in diversity between different categories of protected areas. We also assess the differences in the diversity-area relationship of the different protected area categories in terms of both species richness and phylogenetic diversity. We build a multi-locus phylogeny of 1,519 native vascular plants of Norway, Sweden, and Finland. We estimate the phylogenetic diversity and species richness by combining the phylogeny with publicly available occurrence data and the currently protected area system of Fennoscandia. Our results indicate that protected areas in Fennoscandia hold more diversity when larger, and that phylogenetic diversity increases faster with area than species richness. We found evidence for more diversity outside of protected areas of the different countries of Fennoscandia than inside of protected areas, but no evidence for diversity differences between areas with different protection status. Hence, our results indicate that the current protected area system in Fennoscandia is no more effective in conserving phylogenetic diversity and species richness of vascular plants than a random selection of localities. Our results also indicate that planning conservation strategies around phylogenetic diversity, rather than species richness, might be more effective in protecting vascular plant diversity.&amp;lt;/p&amp;gt;</dc:description>
