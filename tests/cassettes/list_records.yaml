                  <descriptions>
                    <description descriptionType="Abstract">The Galibi Kali'na people are found all along the Caribbean coast, from Venezuela to Brazil. The Galibi Kali'na of Oiapoque migrated to Brazil in the 1950s. Today it is a population of approximately 93 individuals, part of whom live in the village São José dos Galibis, Galibi Indian Land, municipality of Oiapoque, Amapá state, and part of whom are scattered throughout the north and northeast of Brazil. Of this total, approximately 15 individuals speak the Kali'na Telewuy language belonging to the Karib linguistic family. The third generation has Portuguese as their mother tongue. The objective of this work is to present the initial results of the extension project "Kali'na in School: a collaborative construction of teaching materials in the Kali'na language," developed by professors from the Indigenous Intercultural Education Program at the Federal University of Amapá - UNIFAP, in partnership with the Kali'na community. The project promoted training in methods and techniques of Linguistic Documentation of Kali'na; young people from training workshops in handling equipment for audio and video; training in transcription and translation software (Moore et al., 2016; Santos &amp; Silva, 2020; Campetela et al, 2017). We managed to document in audio and video narratives in Kali'nã language, some are transcribed and translated into Portuguese. We intend to present the effects produced by this revitalization initiative, based on a collaborative work, and how the Kali'na youth, after this action, are reacting to resume and strengthen the Kali'na Telewuyu language.</description>
                  </descriptions>
                </resource>
              </metadata>
            </record>
