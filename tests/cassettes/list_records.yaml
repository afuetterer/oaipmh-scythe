                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Costas Moldes, Lena</dc:creator>
                  <dc:creator>Fernández Lago, Uxía</dc:creator>
                  <dc:creator>Vázquez Herrero, Jorge</dc:creator>
                  <dc:date>2026-06-08</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Informaci&amp;oacute;n relevante&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Os arquivos publicados neste repositorio forman parte do Traballo Final de Grao (TFG) titulado "O accidente do Air India AI-171 e a verificaci&amp;oacute;n dixital: o papel das redes sociais, IA e&amp;lt;em&amp;gt; fact-checking &amp;lt;/em&amp;gt;na informaci&amp;oacute;n xornal&amp;iacute;stica", presentado na Facultade de Ciencias da Comunicaci&amp;oacute;n da Universidade de Santiago de Compostela, elaborado por Ux&amp;iacute;a Fern&amp;aacute;ndez Lago e Lena Costas Moldes, baixo a titorizaci&amp;oacute;n de Jorge V&amp;aacute;zquez Herrero, para a obtenci&amp;oacute;n do Grao en Xornalismo.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Descrici&amp;oacute;n dos Anexos&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;O arquivo incl&amp;uacute;e as t&amp;aacute;boas de datos utilizadas na an&amp;aacute;lise de discurso e na an&amp;aacute;lise cuantitativa da investigaci&amp;oacute;n.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;O primeiro anexo corresponde &amp;aacute; an&amp;aacute;lise do discurso, cuxa mostra est&amp;aacute; formada principalmente por verificaci&amp;oacute;ns de &amp;lt;em&amp;gt;fact-checking&amp;lt;/em&amp;gt; procedentes das principais axencias internacionais e das pertinentes da India, as&amp;iacute; como de instituci&amp;oacute;ns do mesmo pa&amp;iacute;s. Estas publicaci&amp;oacute;ns foron localizadas mediante buscas directas nos propios sitios web das axencias e instituci&amp;oacute;ns, filtrando ou buscando pola data do accidente.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Pola outra banda, a mostra da an&amp;aacute;lise cuantitativa foi seleccionada en redes sociais, mediante f&amp;oacute;rmulas con operadores booleanos nas plataformas que o permit&amp;iacute;an, e mediante unha busca por&amp;nbsp;&amp;lt;em&amp;gt;hashtags&amp;lt;/em&amp;gt; e etiquetas naquelas que non admit&amp;iacute;an dita opci&amp;oacute;n. Todas as publicaci&amp;oacute;ns analizadas forman parte das primeiras 72 horas tras o accidente, e cada anexo corresponde a unha rede social: YouTube, TikTok, Instagram e X (Twitter).&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;Os datos foron rexistrados entre o 2 de abril e o 21 de abril de 2026.&amp;lt;/p&amp;gt;</dc:description>
