                  <dc:creator>Cano-Zambrano, Cindy Geovanna</dc:creator>
                  <dc:date>2026-01-31</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Las plantaciones de Tectona grandis (L.f.) constituyen una fuente esencial para&amp;lt;br&amp;gt;satisfacer la creciente demanda de madera de alta calidad y contribuir al manejo sostenible de&amp;lt;br&amp;gt;los recursos forestales. La productividad de estas plantaciones depende de la evaluaci&amp;oacute;n de&amp;lt;br&amp;gt;indicadores dasom&amp;eacute;tricos como di&amp;aacute;metro, altura, &amp;aacute;rea basal y volumen maderable. El estudio&amp;lt;br&amp;gt;tuvo como objetivo determinar el crecimiento peri&amp;oacute;dico y medio anual de una plantaci&amp;oacute;n de T.&amp;lt;br&amp;gt;grandis en el recinto El Chial, cant&amp;oacute;n 24 de Mayo, provincia de Manab&amp;iacute;, Ecuador. La&amp;lt;br&amp;gt;investigaci&amp;oacute;n, de enfoque transversal y alcance explicativo, se desarroll&amp;oacute; en una superficie de&amp;lt;br&amp;gt;8,4 ha bajo un dise&amp;ntilde;o completamente al azar, con densidad de plantaci&amp;oacute;n de 3 m &amp;times; 3 m y cinco&amp;lt;br&amp;gt;parcelas circulares permanentes de 500 m&amp;sup2; cada una. Los resultados indicaron que, a los 19&amp;lt;br&amp;gt;a&amp;ntilde;os y 8 meses de edad, el incremento medio anual (IMA) fue de 0,01 m/a&amp;ntilde;o en di&amp;aacute;metro, 0,93&amp;lt;br&amp;gt;m/a&amp;ntilde;o en altura y 1,09 m&amp;sup2;/ha en &amp;aacute;rea basal; mientras que el volumen total y comercial alcanzaron&amp;lt;br&amp;gt;119,92 m&amp;sup3;/ha y 52,60 m&amp;sup3;/ha, respectivamente. En el mismo periodo, el incremento peri&amp;oacute;dico (IP)&amp;lt;br&amp;gt;fue de 0,004 m en di&amp;aacute;metro, 0,49 m en altura, 4,90 m&amp;sup2;/ha en &amp;aacute;rea basal, 156,81 m&amp;sup3; en volumen&amp;lt;br&amp;gt;total y 42,84 m&amp;sup3; en volumen comercial. Estos resultados reflejan un crecimiento moderado y&amp;lt;br&amp;gt;sostenido bajo condiciones edafoclim&amp;aacute;ticas estables.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.63618/omd/isj/v4/n1/245</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19377197</dc:identifier>
                  <dc:publisher>Innova Science Journal</dc:publisher>
