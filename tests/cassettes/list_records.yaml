                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>123Ve</dc:creator>
                  <dc:date>2026-06-08</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Edge Internet of Things (IoT) visual perception
        terminals increasingly require local intelligent inference to reduce cloud communication latency, bandwidth consumption, and
        privacy risks. Vision Transformer (ViT) models provide strong
        global representation capability for visual recognition, but their
        deployment on resource-constrained edge field-programmable
        gate arrays (FPGAs) is jointly limited by attention intermediate matrices, backbone weight movement, and the resource
        overhead of nonlinear operators. To address these bottlenecks,
        this paper proposes Fused and Folded Vision Transformer (FFViT), a memory-efficient and low-power FPGA accelerator for
        edge IoT visual inference. The architecture maps the Patch
        Embedding and Classification Head weights to on-chip readonly memory, while the homogeneous Transformer backbone
        layers are temporally folded onto a reusable high-level synthesis
        compute engine. Off-chip weight transfers are overlapped with
        computation through static ping-pong block RAM buffering for
        backbone weights and inter-layer activations. In addition, FF-ViT
        adopts a row-wise fused-attention dataflow, reducing the storage
        requirement of the attention matrix from global matrix level to
        row level. Nonlinear functions, including Softmax, LayerNorm,
        and GeLU, are approximated through lookup-table-based fixedpoint pipelines. Measurements on a ZCU102 platform show that
        the proposed accelerator reaches 282.29 frames per second at
        300 MHz, with 3.542 ms latency and 119.41 GOP/s/W boardlevel energy efficiency. These results demonstrate the potential of
        FF-ViT for low-latenc&amp;lt;/p&amp;gt;</dc:description>
