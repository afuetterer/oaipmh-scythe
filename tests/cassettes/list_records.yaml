                  <dc:description>&amp;lt;p&amp;gt;Modern commercial varieties of tomato (&amp;lt;em&amp;gt;Solanum lycopersicum&amp;lt;/em&amp;gt;) are typically F1 hybrids that are genetically heterozygous. Here we generated haplotype-aware assemblies of two different tomato commercial hybrids (Funtelle and Maxeza) using PacBio HiFi reads. The HiFi data was assembled using the Hifiasm assembler allowing for the generation of contigs that distinguish the two parental haplotypes (haplotype-aware assembly). Reference based scaffolding was used to generate the chromosome-scale assemblies available here. It should be noted that although the raw assembly manages to fully distinguish haplotypes we did not test whether the working reference sequence we make available here is fully phased at the chromosome level.&amp;lt;/p&amp;gt;</dc:description>
