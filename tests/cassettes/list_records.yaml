                  <dc:rights>https://creativecommons.org/licenses/by/4.0/legalcode</dc:rights>
                  <dc:source>Innova Science Journal, 4(1), 454-466, (2026-01-31)</dc:source>
                  <dc:subject>Altura; área basal; densidad de plantación; diámetro; volumen maderable.</dc:subject>
                  <dc:title>Dinámica del crecimiento periódico y medio anual de Tectona grandis en una plantación de El Chial, Manabí, Ecuador.</dc:title>
                  <dc:type>info:eu-repo/semantics/article</dc:type>
                </oai_dc:dc>
