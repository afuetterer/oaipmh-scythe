                  <dc:rights>Creative Commons Attribution 1.0 Generic</dc:rights>
                  <dc:rights>https://creativecommons.org/licenses/by/1.0/legalcode</dc:rights>
                  <dc:subject>Kali'na telewuyu. Language documentation. Indigenous language.</dc:subject>
                  <dc:title>THE REVIVAL OF THE KALI'NA TELEWUYU LANGUAGE</dc:title>
