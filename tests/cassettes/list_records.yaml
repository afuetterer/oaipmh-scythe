                    <title>Supplementary data of the article "Identification and Validation of Molecular Mechanisms of Salvia Miltiorrhiza in Treating Diabetic Retinopathy: A Network Pharmacology and Molecular Docking Study."</title>
                  </titles>
                  <publisher>Zenodo</publisher>
                  <publicationYear>2023</publicationYear>
                  <subjects>
                    <subject>Diabetic retinopathy; Salvia miltiorrhiza; Network pharmacology; Molecular docking; Gene enrichment analysis; Luteolin; Tanshinones IIA</subject>
                  </subjects>
                  <dates>
                    <date dateType="Issued">2023-10-12</date>
                    <date dateType="Updated">2023-10-12</date>
                  </dates>
                  <language>ang</language>
                  <resourceType resourceTypeGeneral="JournalArticle"></resourceType>
                  <identifier identifierType="DOI">10.5281/zenodo.8433947</identifier>
                  <relatedIdentifiers>
                    <relatedIdentifier relationType="IsVersionOf" relatedIdentifierType="DOI">10.5281/zenodo.8433946</relatedIdentifier>
                  </relatedIdentifiers>
                  <rightsList>
                    <rights rightsURI="https://creativecommons.org/licenses/by/4.0/legalcode" rightsIdentifierScheme="spdx" rightsIdentifier="cc-by-4.0">Creative Commons Attribution 4.0 International</rights>
                    <rights rightsURI="info:eu-repo/semantics/openAccess"/>
                  </rightsList>
                  <descriptions>
                    <description descriptionType="Abstract">Diabetic retinopathy (DR) is a condition caused by damage to the blood vessels in the retina, leading to abnormal blood vessel growth, swelling, and leakage. Salvia miltiorrhiza (SM), a traditional Chinese herb used for medicinal purposes, has shown potential benefits for treating DR due to its antioxidant, anti-inflammatory, vasodilatory, and anti-angiogenic effects. Yet, the molecular mechanism underlying SM’s therapeutic effects on DR is unclear. To address this issue, the current study used network pharmacology and molecular docking techniques to identify and validate potential mechanisms involved in SM’s treatment of DR.
        
        
        Active constituents of SM were retrieved from the TCMSP, and DR-associated targets were collected from the GeneCards and Diaretinopathy databases. Overlapping targets between SM constituents and DR-associated targets were utilized to create the salvia miltiorrhiza constituents target-diabetic retinopathy network and protein-protein interaction network. Gene enrichment analysis identified potential therapeutic SM mechanisms in DR treatment, including biological processes, cellular components, molecular functions, and signaling pathways. Docking results confirmed stable interactions between SM constituents and DR targets.
        
        
        The study offers possible molecular mechanisms for treating DR using SM and suggests further wet lab experiments to corroborate the computational analysis findings. The findings provide a basis for additional research and the potential development of SM-based therapies for DR.</description>
                  </descriptions>
                </resource>
              </metadata>
            </record>
