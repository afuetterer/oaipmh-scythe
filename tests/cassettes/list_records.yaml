              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Runpeng Miao</dc:creator>
                  <dc:date>2023-10-12</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;Folder: &amp;nbsp;&amp;nbsp; &amp;nbsp;GA-feature-subset-selection&amp;lt;br&amp;gt;
        File:&amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;GA algorithm for feature subselection&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;The code implements a genetic algorithm approach for feature selection in machine learning using linear regression as the base model&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Folder: &amp;nbsp;&amp;nbsp; &amp;nbsp;Voting-regressor&amp;lt;br&amp;gt;
        File:&amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;Feature importance ranking&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;This code implements the calculation of feature importance of all features by using the dataset of interest fitted in Decision Tree model&amp;nbsp;&amp;lt;br&amp;gt;
        File:&amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;Bayesian optimization&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;The code will optimize each model separately using Bayesian Optimization and provide the best parameters and score for each model&amp;lt;br&amp;gt;
        File:&amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;Voting regressor with 5 models&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;This code utilizes a voting regressor to ensemble five tree-based models, each with optimized hyperparameters, in order to achieve the best predictive capability for the model&amp;lt;/p&amp;gt;
        
        &amp;lt;p&amp;gt;Folder: &amp;nbsp;&amp;nbsp; &amp;nbsp;Auto-data-splitting-by-article-ID&amp;lt;br&amp;gt;
        File: &amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;Auto data splitting by article ID&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;Performs splitting of the database into test and training datasets from distinct sources (article ID)&amp;lt;br&amp;gt;
        File:&amp;nbsp;&amp;nbsp; &amp;nbsp;&amp;nbsp;&amp;nbsp; &amp;nbsp;Bayes_opt + CV by auto datasplitting by article ID&amp;lt;br&amp;gt;
        Description:&amp;nbsp;&amp;nbsp; &amp;nbsp;The code employs Bayesian optimization to optimize the hyperparameters of the XGBoost model on diverse datasets obtained through the &amp;#39;extract_rows&amp;#39; function of the &amp;#39;Auto data splitting by article ID.py&amp;#39;&amp;lt;/p&amp;gt;</dc:description>
