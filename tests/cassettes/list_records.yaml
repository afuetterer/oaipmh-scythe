                  <titles>
                    <title>PocketCoffea: a configuration layer for CMS analyses with Coffea</title>
                  </titles>
                  <publisher>Zenodo</publisher>
                  <publicationYear>2023</publicationYear>
                  <dates>
                    <date dateType="Issued">2023-10-10</date>
                    <date dateType="Updated">2023-10-12</date>
                  </dates>
                  <resourceType resourceTypeGeneral="Text">Presentation</resourceType>
                  <identifier identifierType="DOI">10.5281/zenodo.8435696</identifier>
                  <relatedIdentifiers>
                    <relatedIdentifier relationType="IsVersionOf" relatedIdentifierType="DOI">10.5281/zenodo.8435695</relatedIdentifier>
                  </relatedIdentifiers>
                  <rightsList>
                    <rights rightsURI="https://creativecommons.org/licenses/by/4.0/legalcode" rightsIdentifierScheme="spdx" rightsIdentifier="cc-by-4.0">Creative Commons Attribution 4.0 International</rights>
                    <rights rightsURI="info:eu-repo/semantics/openAccess"/>
                  </rightsList>
                  <descriptions>
                    <description descriptionType="Abstract">A configuration layer for the analysis of CMS data in the NanoAOD format is presented. The framework is based on the columnar analysis of proton-proton collision events with the Coffea Python package and it focuses on configurability and reproducibility of analysis tasks.
        
        
        All the operations needed to extract the relevant information from events are performed by a Coffea processor object that takes the NanoAOD events as input and returns a set of output histograms or arrays.
        PocketCoffea defines a configuration scheme to specify all the parameters and settings of the processor: the datasets definition, object and event selections, Monte Carlo weights, systematic uncertainties and the output histograms characteristics. The configuration layer is user friendly and speeds up the setup of many common analysis tasks.
        A structured processor performing operations that are common among CMS analyses is defined and can be customized with derived processor classes, allowing code sharing between different analyses workflows in a hierarchical structure.
        With its configurable structure, PocketCoffea is a suitable tool to perform any CMS analysis in a highly reproducible, computational efficient and user-friendly way.</description>
                  </descriptions>
                </resource>
              </metadata>
            </record>
