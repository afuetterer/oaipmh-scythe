              <metadata>
                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Liyanage, Arawwawala Dona Madhusha Dhanukshi</dc:creator>
                  <dc:creator>Jayalath, D</dc:creator>
                  <dc:creator>Udayanga, Viraj</dc:creator>
                  <dc:creator>Nanayakkara, Prasadi</dc:creator>
                  <dc:creator>Nandasena, Sumal</dc:creator>
                  <dc:creator>Perera, GAC</dc:creator>
                  <dc:creator>Gunathilaka, RMBC</dc:creator>
                  <dc:creator>Malawalaarachchi, LD</dc:creator>
                  <dc:date>2025-07-13/2025-07-16</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;em&amp;gt;This abstract was presented at the &amp;lsquo;Global Public Health Summit 2025 and 30&amp;lt;sup&amp;gt;th&amp;lt;/sup&amp;gt; Annual Academic Sessions of the College of Community Physicians of Sri Lanka&amp;rsquo;.&amp;lt;/em&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;em&amp;gt;The abstract was published in the official conference abstract book dedicated for &amp;ldquo;Best Practices in Public Health&amp;rdquo;. Only the relevant pages (cover page and author&amp;rsquo;s abstract) are included here.&amp;lt;/em&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;em&amp;gt;This work contributes to public health evidence dissemination.&amp;lt;/em&amp;gt;&amp;lt;/p&amp;gt;</dc:description>
                  <dc:description>&amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Background:&amp;lt;/strong&amp;gt; Medical officer of health (MOH) offices deliver a vast range of services. Regular and comprehensive supervision of these services by supervisory officers is crucial to ensure timeliness, accuracy and quality of service.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;strong&amp;gt;Description of the intervention/ initiative:&amp;lt;/strong&amp;gt; A strategy was planned to strengthen the district supervision methodology. From 2025 all completed supervision reports were collected monthly from each MOH and evaluated at district level. At the end of each month new formats for the ensuing month and evaluated supervisions from the previous month were delivered to the MOH office accompanied by an official written communication acknowledging the number of supervision reports forwarded. MOH offices were given access to view a database which identified each supervisory officer by name and designation with the number of supervisions submitted. Progress of reporting was displayed at supervisory officers&amp;rsquo; meetings. Key observations were communicated duly via online meetings.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;strong&amp;gt;Methods used for the evaluation:&amp;lt;/strong&amp;gt; Medical officers and the public health nursing sister should complete six supervisions per month while supervising public health inspector and supervising public health midwife should complete ten. All supervision reports submitted on the last day of each month were considered timely while their completeness was evaluated at district level.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;strong&amp;gt;Results:&amp;lt;/strong&amp;gt; Out of 18 MOHs 16 showed an increase in the supervision report submission rates. The district value showed an increase from 50% to 62 % from January to February. In January 9 MOHs achieved a submission rate &amp;ge;50% while 13 achieved &amp;ge;50% in February.&amp;lt;/p&amp;gt;
        &amp;lt;p&amp;gt;&amp;lt;strong&amp;gt;Lessons learnt:&amp;lt;/strong&amp;gt; Transparent monitoring systems improve quality of supervisions and thus potentially improve overall performance of services delivered by MOH offices.&amp;lt;/p&amp;gt;</dc:description>
                  <dc:identifier>https://doi.org/10.5281/zenodo.19368744</dc:identifier>
                  <dc:identifier>oai:zenodo.org:19368744</dc:identifier>
                  <dc:publisher>Zenodo</dc:publisher>
                  <dc:relation>https://doi.org/10.5281/zenodo.19368743</dc:relation>
