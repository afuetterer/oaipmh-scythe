                <oai_dc:dc xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:oai_dc="http://www.openarchives.org/OAI/2.0/oai_dc/" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd">
                  <dc:creator>Ahmad Abbas Hussain</dc:creator>
                  <dc:date>2026-06-12</dc:date>
                  <dc:description>&amp;lt;h2&amp;gt;🎯 RoleRadius v1.0.0 — Initial Release&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;A full-stack recruitment portal applying &amp;lt;strong&amp;gt;TF-IDF cosine similarity&amp;lt;/strong&amp;gt; to match
        job seekers with relevant vacancies. Built as a final year Computer Science
        dissertation project.&amp;lt;/p&amp;gt;
        
        
        &amp;lt;h3&amp;gt;✨ What's in this release&amp;lt;/h3&amp;gt;
        &amp;lt;h4&amp;gt;AI &amp;amp; Backend&amp;lt;/h4&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;TF-IDF cosine similarity matching engine (scikit-learn, bigrams, 8000 features)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Match score (0–100%) stored on every application, shown to candidates and recruiters&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;CV text extraction: PDF (pdfminer.six), DOCX (python-docx), TXT&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;JWT authentication in &amp;lt;strong&amp;gt;httpOnly cookies&amp;lt;/strong&amp;gt; (no localStorage XSS vulnerability)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Account lockout via django-axes (5 failures → 30-minute lockout)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Email verification with signed tokens (24-hour expiry)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Job alerts — candidates emailed when a matching job is posted (≥40% score)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Status notifications — candidates emailed on every pipeline stage change&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;7-stage application pipeline with immutable status history audit log&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Soft delete on jobs (preserves all application history)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;6 composite database indexes on the jobs table&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;@transaction.atomic&amp;lt;/code&amp;gt; on job applications (data integrity)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Rate limiting: 5 login/min, 3 password-reset/min, 10 register/hour&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Auto-generated Swagger UI at &amp;lt;code&amp;gt;/api/schema/swagger-ui/&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Health check endpoint at &amp;lt;code&amp;gt;/api/health/&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;h4&amp;gt;Frontend&amp;lt;/h4&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;React 18 SPA with Vite 5, Tailwind CSS, lazy-loaded routes&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Email verification banner for unverified users&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Delete confirmation dialog for all destructive actions&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;StrictMode-safe &amp;lt;code&amp;gt;AuthContext&amp;lt;/code&amp;gt; with &amp;lt;code&amp;gt;useRef&amp;lt;/code&amp;gt; double-call guard&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;Auto-refresh interceptor that avoids infinite 401 loops&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;h4&amp;gt;Infrastructure&amp;lt;/h4&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;Docker Compose stack (PostgreSQL + Django + React) with healthchecks&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;GitHub Actions CI: 61 tests + React production build on every push&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        &amp;lt;h4&amp;gt;Seed data&amp;lt;/h4&amp;gt;
        &amp;lt;ul&amp;gt;
        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;python manage.py seed_jobs&amp;lt;/code&amp;gt; — 95 jobs across 8 companies&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;All 5 job types (full-time, part-time, contract, freelance, internship)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;All 3 work modes (onsite, remote, hybrid)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;All 5 experience levels (entry → executive)&amp;lt;/li&amp;gt;
        &amp;lt;li&amp;gt;8 industry sectors: Software, Data, Healthcare, Fintech, Creative, EdTech, Gaming, Clean Energy&amp;lt;/li&amp;gt;
        &amp;lt;/ul&amp;gt;
        
        
        &amp;lt;h3&amp;gt;🚀 Quick start&amp;lt;/h3&amp;gt;
        &amp;lt;pre&amp;gt;&amp;lt;code class="language-bash"&amp;gt;cd backend
        pip install -r requirements.txt
        python manage.py migrate
        python manage.py seed_jobs
        python manage.py runserver
        
        # New terminal
        cd frontend &amp;amp;&amp;amp; npm install &amp;amp;&amp;amp; npm run dev
        # → http://localhost:5173
        &amp;lt;/code&amp;gt;&amp;lt;/pre&amp;gt;
        &amp;lt;h3&amp;gt;🔑 Demo accounts (password: &amp;lt;code&amp;gt;demo1234&amp;lt;/code&amp;gt;)&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;| Role | Email |
        |------|-------|
        | Recruiter | hr@techcorp.com |
        | Recruiter | talent@dataventures.io |
        | Candidate | priya.sharma@email.com ← best AI match demo |
        | Candidate | alex.chen@email.com |
        | Candidate | tom.walker@email.com |&amp;lt;/p&amp;gt;
        
        
        &amp;lt;h3&amp;gt;📄 Citation&amp;lt;/h3&amp;gt;
        &amp;lt;pre&amp;gt;&amp;lt;code class="language-bibtex"&amp;gt;@software{hussain2026roleradius,
          author    = {Hussain, Ahmad Abbas},
