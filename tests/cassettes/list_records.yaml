                  <dc:description>&amp;lt;h3&amp;gt;Abstract&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;Network reconnaissance is becoming increasingly difficult due to the wider use of intrusion detection and prevention systems (IDS/IPS), but bypassing these systems remains realistic. This paper examines the mechanisms of IDS/IPS systems and justifies the relevance of avoiding detection by such systems. Examples of scanning modes are provided, and their advantages and disadvantages are explained.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;h3&amp;gt;Анотація&amp;lt;/h3&amp;gt;
        &amp;lt;p&amp;gt;Мережева розвідка стає все більше складною через ширше застосування систем виявлення і запобігання вторгнень (IDS/IPS), однак обхід даних систем лишається реалістичним. У роботі розглядаються механізми роботи систем IDS/IPS і обґрунтовується актуальність уникнення детекцій відповідними системами. Надаються приклади режимів сканування та пояснюються їх переваги та недоліки.&amp;lt;/p&amp;gt;</dc:description>
