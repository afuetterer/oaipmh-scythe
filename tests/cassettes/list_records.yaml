                  <dc:relation>https://doi.org/10.5281/zenodo.20686622</dc:relation>
                  <dc:rights>info:eu-repo/semantics/openAccess</dc:rights>
                  <dc:rights>Apache License 2.0</dc:rights>
                  <dc:rights>http://www.apache.org/licenses/LICENSE-2.0</dc:rights>
                  <dc:subject>SMT solver</dc:subject>
                  <dc:subject>satisfiability modulo theories</dc:subject>
                  <dc:subject>exact arithmetic</dc:subject>
                  <dc:subject>deterministic</dc:subject>
                  <dc:subject>DPLL(T)</dc:subject>
                  <dc:subject>Rust</dc:subject>
                  <dc:subject>WebAssembly</dc:subject>
                  <dc:title>rz3: a deterministic, exact-rational SMT solver in pure Rust</dc:title>
