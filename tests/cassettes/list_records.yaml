                  <dc:creator>Xavier, Daniele dos Santos Ramos</dc:creator>
                  <dc:date>2025-04-18</dc:date>
                  <dc:description>&amp;lt;p&amp;gt;A energia el&amp;eacute;trica &amp;eacute; atualmente a principal alternativa aos combust&amp;iacute;veis f&amp;oacute;sseis para redu&amp;ccedil;&amp;atilde;o das emiss&amp;otilde;es das frotas veiculares. Nas frotas de &amp;ocirc;nibus, os ve&amp;iacute;culos el&amp;eacute;tricos j&amp;aacute; s&amp;atilde;o utilizados h&amp;aacute; um certo tempo. Atualmente Tr&amp;oacute;lebus e &amp;Ocirc;nibus El&amp;eacute;tricos a Bateria (BEBs) est&amp;atilde;o em opera&amp;ccedil;&amp;atilde;o no Brasil, por&amp;eacute;m possuem limita&amp;ccedil;&amp;otilde;es operacionais, os tr&amp;oacute;lebus precisam de rede a&amp;eacute;rea para operar, pelo menos em parte de seu caminho e os BEBs dependem da autonomia de energia dispon&amp;iacute;vel em suas baterias. Uma alternativa a essas limita&amp;ccedil;&amp;otilde;es s&amp;atilde;o os &amp;ocirc;nibus el&amp;eacute;tricos com c&amp;eacute;lula de combust&amp;iacute;vel, em ingl&amp;ecirc;s Full Cell Electric Bus (FCEB), uma tecnologia hibrida, que utiliza c&amp;eacute;lula de combust&amp;iacute;vel de hidrog&amp;ecirc;nio para dar autonomia ao motor el&amp;eacute;trico. Desse modo, esse estudo prop&amp;otilde;e comparar os modelos existentes de Zero Emission Buses (ZEBs), em especial o FCEB, com o Tr&amp;oacute;lebus e o BEB verificando suas vantagens e desvantagens e melhor desempenho operacional para cada um desses modelos. Os resultados indicaram que os FCEBs s&amp;atilde;o promissores para m&amp;eacute;dias e longas dist&amp;acirc;ncias, mas ainda n&amp;atilde;o s&amp;atilde;o competitivos com os BEBs para curtas e m&amp;eacute;dias dist&amp;acirc;ncias e os Tr&amp;oacute;lebus s&amp;atilde;o importantes e ideais para linhas de alta demanda e corredores exclusivos devido ao custo da infraestrutura necess&amp;aacute;ria&amp;lt;/p&amp;gt;
        
        &amp;lt;div class="item downloads_chart"&amp;gt;&amp;nbsp;&amp;lt;/div&amp;gt;</dc:description>
